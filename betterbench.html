<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetterBench</title>
<!--
  BetterBench v3 - all-in-one molecular biology workspace.
  Single file, no build step. Everything is stored in your browser (localStorage).

  Double-click to open. Three features make outbound web requests (UniProt lookup,
  AlphaFold model download, optional ESMFold prediction). If those fail with
  "failed to fetch" on a double-clicked file, serve the folder instead:
      python -m http.server
  then open http://localhost:8000/betterbench.html
-->
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<style>
  :root{
    --bg:#f4f7fb; --panel:#ffffff; --panel2:#fafbfd; --ink:#16202b; --muted:#66788c;
    --line:#e2e8f0; --line2:#eef2f7; --accent:#2f6fed; --accent-soft:#eaf1ff; --accent2:#7c5cf0;
    --red:#d4504a; --red-soft:#fdeceb; --green:#17915f; --green-soft:#e8f7f0;
    --amber:#b57d09; --amber-soft:#fdf6e3; --sel:#ffe680; --shadow:0 1px 3px rgba(20,35,60,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* ---------- chrome ---------- */
  header.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:0 18px;height:54px;
       display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:900}
  header.topbar .brand{font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
  header.topbar .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:20px}
  header.topbar .spacer{margin-left:auto}
  .shell{display:flex;align-items:flex-start;min-height:calc(100vh - 54px)}
  nav.rail{width:196px;flex:0 0 196px;padding:16px 10px;border-right:1px solid var(--line);background:var(--panel);
       position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
  nav.rail .navitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;
       color:var(--muted);font-weight:500;margin-bottom:2px;user-select:none;font-size:13px}
  nav.rail .navitem:hover{background:var(--panel2);color:var(--ink)}
  nav.rail .navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  nav.rail .navitem .ic{width:18px;text-align:center;font-size:14px}
  nav.rail .navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#9aa8b8;
       padding:14px 10px 6px;font-weight:700}
  main.content{flex:1;padding:22px 26px 60px;max-width:1240px;min-width:0}
  @media(max-width:820px){
    .shell{flex-direction:column}
    nav.rail{width:100%;flex:none;position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:none;border-bottom:1px solid var(--line)}
    nav.rail .navsec{display:none}
    main.content{padding:16px}
  }

  /* ---------- primitives ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .panel.tight{padding:14px}
  h1.page{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}
  p.lede{color:var(--muted);margin:0 0 18px;font-size:13px;max-width:74ch;line-height:1.55}
  h2{font-size:14px;margin:0 0 10px;letter-spacing:-.1px}
  h3{font-size:12.5px;margin:0 0 8px;color:var(--ink)}
  label{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-weight:600;
        text-transform:uppercase;letter-spacing:.4px}
  label.plain{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
  input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
        font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  textarea{resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
  button{font-family:inherit}
  button.primary{background:var(--accent);color:#fff;border:none;padding:9px 15px;border-radius:8px;cursor:pointer;
        font-size:13px;font-weight:600}
  button.primary:hover{background:#2560d8}
  button.primary[disabled]{background:#b9c8e4;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid var(--line);padding:6px 11px;border-radius:7px;cursor:pointer;
        font-size:12px;color:var(--muted);font-weight:500}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  button.ghost.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--red);border-color:#f2c9c6}
  button.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
  .muted{color:var(--muted);font-size:12.5px}
  .small{font-size:11.5px}
  .note{background:var(--amber-soft);border:1px solid #f0e3a8;border-radius:8px;padding:10px 12px;font-size:12px;
        color:#7a6a1f;margin-top:10px;line-height:1.55}
  .note code{background:#fdf3c0;padding:1px 5px;border-radius:4px}
  .note.info{background:var(--accent-soft);border-color:#c8dbff;color:#254a91}
  .note.ok{background:var(--green-soft);border-color:#bfe6d5;color:#0f6b46}
  .note.warn{background:var(--red-soft);border-color:#f5cdca;color:#98332e}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.3px;
        text-transform:uppercase;vertical-align:middle}
  .pill.blue{background:var(--accent-soft);color:var(--accent)}
  .pill.green{background:var(--green-soft);color:var(--green)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .pill.red{background:var(--red-soft);color:var(--red)}
  .pill.grey{background:#eef1f5;color:#6b7a8d}
  .stat{display:inline-block;margin-right:14px;font-size:12.5px;color:var(--muted)}
  .stat b{color:var(--ink);font-weight:650}
  .sidecard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px}
  .lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .toggle button{border:none;background:#fff;padding:6px 13px;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500}
  .toggle button.on{background:var(--accent);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  th{color:var(--muted);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  tr:last-child td{border-bottom:none}
  .scrollx{overflow-x:auto}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
  .empty{text-align:center;padding:34px 20px;color:var(--muted)}
  .empty .big{font-size:32px;margin-bottom:8px;opacity:.5}

  /* ---------- gallery ---------- */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;
        transition:.12s;min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
  .card:hover{border-color:var(--accent);box-shadow:0 3px 14px rgba(47,111,237,.11);transform:translateY(-1px)}
  .card .nm{font-weight:650;font-size:13.5px;margin-bottom:5px;word-break:break-word;line-height:1.3}
  .card .sub{font-size:11.5px;color:var(--muted)}
  .card .chips{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
  .card.new{align-items:center;justify-content:center;color:var(--accent);border-style:dashed;text-align:center;font-weight:600}
  .card.new .plus{font-size:30px;line-height:1;margin-bottom:4px}

  /* ---------- detail / sequence ---------- */
  .detailgrid{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .col-left{flex:0 0 230px;min-width:200px}
  .col-mid{flex:1 1 400px;min-width:320px;text-align:center}
  .col-right{flex:0 0 260px;min-width:230px}
  .comp{display:flex;align-items:center;gap:7px;padding:5px;border-radius:6px;cursor:pointer;font-size:11.5px}
  .comp:hover{background:var(--accent-soft)}
  .comp-sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}
  .comp-nm{flex:1;word-break:break-word}
  .comp-pos{color:var(--muted);flex:0 0 auto;font-size:10.5px}
  .comp-x{border:none;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0 2px}
  .seqwrap{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--panel2);max-height:340px;
        overflow:auto;text-align:left}
  .seqline{display:flex;gap:10px;line-height:1.65}
  .pos{color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;white-space:pre;user-select:none}
  .bases{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .b{cursor:pointer}
  .b.sel{background:var(--sel);box-shadow:inset 0 -2px 0 #e0a800}
  .b.prev{background:#fff0b3}
  .seqbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;line-height:1.55;
        background:var(--panel2);padding:11px;border-radius:8px;border:1px solid var(--line);max-height:230px;overflow:auto}
  svg text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}

  /* ---------- alignment ---------- */
  .alnblock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre;
        overflow-x:auto;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px}
  .aln-lbl{display:inline-block;width:78px;color:var(--muted);font-size:10.5px}
  .mm{background:#ffd8d5;color:#8f2f29;font-weight:700}
  .gp{background:#e6e9ee;color:#5a6675}

  /* ---------- overlays ---------- */
  .modalbg{position:fixed;inset:0;background:rgba(18,28,42,.4);z-index:1200;display:flex;align-items:center;
        justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:820px;width:100%;max-height:86vh;overflow:auto;
        box-shadow:0 18px 56px rgba(0,0,0,.28)}
  .sidebar{position:fixed;right:0;top:0;height:100%;width:320px;background:#fff;border-left:1px solid var(--line);
        box-shadow:-6px 0 26px rgba(0,0,0,.11);padding:20px;z-index:1100;overflow:auto}
  .swatch{display:inline-block;width:20px;height:20px;border-radius:6px;margin:0 5px 5px 0;cursor:pointer;
        border:2px solid transparent;vertical-align:middle}
  .swatch.on{border-color:var(--ink)}
  .menuitem{padding:7px 12px;font-size:12.5px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .menuitem:hover{background:var(--accent-soft)}
  .menuitem.danger{color:var(--red)}
  .menuitem.muted{color:var(--muted)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16202b;color:#fff;
        padding:10px 18px;border-radius:9px;font-size:13px;z-index:2000;box-shadow:0 6px 24px rgba(0,0,0,.28)}

  /* ---------- protocol runner ---------- */
  .step{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px}
  .step:hover{background:var(--panel2)}
  .step.done{opacity:.5}
  .step.done .steptext{text-decoration:line-through}
  .step input[type=checkbox]{width:16px;height:16px;flex:0 0 auto;margin-top:2px;accent-color:var(--accent)}
  .steptext{flex:1;line-height:1.55;font-size:12.5px}
  .stepmeta{font-size:11px;color:var(--muted);margin-top:2px}

  /* ---------- how-it-works explainer ---------- */
  .howbox{font-size:13px;line-height:1.6;color:var(--ink-2);max-width:72ch;display:flex;flex-direction:column;gap:10px}
  .howbox h3{font-size:12.5px;margin:6px 0 0;color:var(--ink)}
  .howbox p{margin:0}
  .howdiag{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:14px;
        font-size:11.5px;line-height:1.7;white-space:pre;overflow-x:auto;color:var(--ink)}
  .howfwd{color:var(--accent);font-weight:700}
  .howrev{color:var(--accent2);font-weight:700}
  .howmut{color:var(--red);font-weight:700}

  /* ---------- make-this routes ---------- */
  .routegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:4px}
  .routecard{border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;background:var(--panel2);
        transition:.12s}
  .routecard:hover{border-color:var(--accent)}
  .routecard:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .routecard.on{border-color:var(--accent);background:var(--accent-soft)}
  .routecard.blocked{opacity:.72}
  .card .cardmake{position:absolute;bottom:8px;right:8px;border:1px solid var(--line);background:var(--panel);
        border-radius:7px;cursor:pointer;font-size:12px;padding:2px 7px;opacity:0;transition:opacity .12s}
  .card:hover .cardmake{opacity:1}
  .card .cardmake:hover{border-color:var(--accent)}

  /* ---------- point mutation ---------- */
  .muttail{background:#ffe0b3;border-radius:3px;color:#7a4a00;font-weight:600}
  .mutdiff{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px;
        display:flex;flex-direction:column;gap:6px;overflow-x:auto}
  .mutdiff .mono{font-size:12.5px;white-space:nowrap}
  .mutlbl{display:inline-block;width:72px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
        color:var(--muted);font-weight:700}
  .mutold{background:#ffd8d5;color:#8f2f29;border-radius:3px;padding:0 2px}
  .mutnew{background:#d6f5d6;color:#17632f;border-radius:3px;padding:0 2px}

  /* ---------- structure ladder ---------- */
  .ladder{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .lrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
  .lrow .pill{flex:0 0 auto;min-width:64px;text-align:center}
  .candrow{display:flex;align-items:center;gap:12px;padding:10px 11px;border:1px solid var(--line);
        border-radius:9px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
  .candrow:hover{border-color:var(--accent);background:var(--accent-soft)}
  .candrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .candrow.on{border-color:var(--accent);background:var(--accent-soft)}
  .candsub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- protocol tree ---------- */
  .tree{display:flex;flex-direction:column}
  .tnode{border-top:1px solid var(--line2)}
  .tnode:first-child{border-top:none}
  .tbranch{display:flex;align-items:center;gap:10px;padding:11px 6px;cursor:pointer;user-select:none;border-radius:7px}
  .tbranch:hover{background:var(--panel2)}
  .tbranch:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tcaret{font-size:10px;color:var(--muted);transition:transform .12s;width:10px;flex:0 0 auto}
  .tbranch.open .tcaret{transform:rotate(90deg)}
  .tname{font-weight:650;font-size:13.5px;flex:0 0 auto}
  .tcount{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
        border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .tleaves{padding:0 0 8px 24px;display:flex;flex-direction:column;border-left:1px solid var(--line2);margin-left:10px}
  .tleaf{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;border-radius:7px;font-size:12.5px}
  .tleaf:hover{background:var(--accent-soft)}
  .tleaf:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tleafnm{font-weight:550;flex:0 0 auto}
  .tmeta{color:var(--muted);font-size:11.5px;flex:1}
  .tprog{display:inline-flex;align-items:center;gap:7px}
  .tprog .bar{display:inline-block;height:5px}

  /* ---------- pre-check rows: click or drag to select ---------- */
  .obrow{display:flex;gap:9px;align-items:center;margin:2px 0;padding:5px 8px;border-radius:7px;
        text-transform:none;font-weight:400;letter-spacing:0;font-size:12.5px;color:var(--ink);
        cursor:pointer;user-select:none;border:1px solid transparent}
  .obrow:hover{background:var(--panel2);border-color:var(--line)}
  .obrow.on{background:var(--accent-soft)}
  .obrow input{accent-color:var(--accent)}

  /* ---------- foldaway detail sections ---------- */
  details.fold{border-top:1px solid var(--line2);margin-top:8px}
  details.fold > summary{cursor:pointer;list-style:none;padding:8px 0 4px;font-size:11.5px;font-weight:600;
        color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
  details.fold > summary::-webkit-details-marker{display:none}
  details.fold > summary::before{content:"▸";font-size:10px;transition:transform .12s;color:var(--muted)}
  details.fold[open] > summary::before{transform:rotate(90deg)}
  details.fold > summary:hover{color:var(--accent)}

  /* ---------- construct cards: reorder + colour ---------- */
  .card{position:relative}
  .card .cardstripe{position:absolute;left:0;right:0;top:0;height:3px;border-radius:11px 11px 0 0}
  .card .carddot{position:absolute;top:9px;right:9px;width:13px;height:13px;border-radius:50%;
        border:1.5px solid transparent;cursor:pointer;padding:0;opacity:0;transition:opacity .12s}
  .card:hover .carddot{opacity:1}
  .card .carddot:hover{transform:scale(1.2)}
  .card .cardnote{position:absolute;bottom:9px;right:10px;font-size:9.5px;letter-spacing:.06em;
        text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
  .card.dragging{opacity:.4}
  .card.dropzone{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .cswatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .cswatch.on{border-color:var(--ink)}
  .cswatch.none{background:var(--panel2);border-color:var(--line);color:var(--muted);font-size:12px}

  /* ---------- a back button you can find ---------- */
  .backbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-weight:600;
        padding:7px 14px 7px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;
        display:inline-flex;align-items:center;gap:7px}
  .backbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .backbtn span{font-size:15px;line-height:1}

  /* ---------- onboarding ---------- */
  .onboard{max-width:960px;margin:0 auto;padding:18px 0 40px}
  .onboard-head{margin-bottom:26px}
  .eyebrow-ob{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
        font-weight:700;margin-bottom:8px}
  .obgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
  .obcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;
        transition:.12s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
  .obcard:hover,.obcard:focus-visible{border-color:var(--accent);transform:translateY(-1px);
        box-shadow:0 4px 16px rgba(47,111,237,.13);outline:none}
  .obcard.on{border-color:var(--accent);background:var(--accent-soft)}
  .obcard .obic{font-size:24px;line-height:1}
  .obcard h3{font-size:15px;margin:0}
  .obcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
  .obcard .obex{font-size:11.5px;color:var(--muted);font-style:italic}
  .obcard .obtools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

  /* ---------- start screen ---------- */
  .actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .actcard{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
        border-radius:10px;padding:14px;cursor:pointer;transition:.12s}
  .actcard:hover,.actcard:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
  .actcard .actic{font-size:17px;line-height:1.2;flex:0 0 auto}
  .actcard h3{margin:0 0 3px;font-size:13.5px}
  .actcard p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
  .statrow{display:flex;gap:18px;flex-wrap:wrap}

/* ==== 10-state.js ==== */
/* =========================================================================

/* ===================== 1. STATE ===================== */
const STORE_KEY = "betterbench.v3";
const LEGACY_KEY = "minibench.v2";
let state = load();

function uid(){ return Math.random().toString(36).slice(2,9); }
function today(){ return new Date().toISOString().slice(0,10); }

function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){}
  if(!s){
    // one-time migration from the v2 prototype so nothing is lost
    let old = null;
    try { old = JSON.parse(localStorage.getItem(LEGACY_KEY)); } catch(e){}
    if(old && old.plasmids) s = { plasmids: old.plasmids, migrated:true };
  }
  if(!s) s = seed();
  return normalize(s);
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast("Could not save - storage full?"); } }

function normalize(s){
  s.v = 3;
  s.plasmids = s.plasmids || [];
  s.view = s.view || "start";
  s.pView = s.pView || "home";
  s.creating = false;
  if(s.curPlasmid === undefined) s.curPlasmid = null;
  s.customProtocols = s.customProtocols || [];
  s.runs = s.runs || {};          // protocolId -> {checked:[], started, note}
  s.builds = s.builds || [];      // saved cloning plans
  s.connect = s.connect || { enabled:false, name:"", org:"", contact:"", topics:"", shareMode:"features", optIn:{} };
  /* --- what is on the shelf, beyond the plasmids themselves --- */
  s.reagents = s.reagents || {};
  s.reagents.enzymes = s.reagents.enzymes || {};   // name -> {units, loc, exp, note}
  s.reagents.oligos  = s.reagents.oligos  || [];   // {id,name,seq,conc,vol,loc,date,note}
  s.reagents.cells   = s.reagents.cells   || [];   // {id,strain,eff,vials,loc,date,note}
  /* --- reusable parts: the vocabulary the planner composes from --- */
  s.parts = s.parts || [];        // {id,name,kind,seq,sourceId,sourceSpan,tags,note}
  /* --- sequences you have taught the pre-check to recognise --- */
  s.features = s.features || [];  // {id,name,kind,seq,note,created}

  s.signals = s.signals || [];    // {id,text,stage,tags,date,share}
  /* --- rough costings; every lab's differ, so they are editable in Tools --- */
  s.rates = s.rates || { currency:"$", synthPerBp:0.09, vectorFee:35, oligoPerBase:0.25, enzymePerRxn:2.50,
                         seqPerRead:5, daysPerClone:4, daysPerOrder:8 };
  if(s.rates.vectorFee === undefined) s.rates.vectorFee = 35;
  /* --- which tools this person needs; set by the picker on first run --- */
  s.profile = s.profile || { id:null, depth:"simple", onboarded:false, added:[] };
  /* --- who you are, for stamping shared reagents --- */
  s.lab = s.lab || { me:"", labName:"", lastMerge:null };
  if(!s.lab.polymerase) s.lab.polymerase = "Q5";
  if(!s.lab.targetTa) s.lab.targetTa = 60;
  if(s.profile.added === undefined) s.profile.added = [];
  if(!s.profile.depth) s.profile.depth = "simple";
  s.plasmids.forEach(p => {
    p.type = p.type || "dna";
    p.topology = p.topology || "circular";
    p.ann = p.ann || [];
    p.ann.forEach(a => { a.kind = a.kind || "custom"; a.strand = a.strand || 1; });
    p.uniprot = p.uniprot || "";
    p.stock = p.stock || [];
    p.tags = p.tags || [];
    p.created = p.created || today();
    p.source = p.source || "";
    p.parents = p.parents || [];   // {id, name, role} - provenance

    if(p.inSilico === undefined) p.inSilico = p.stock.length === 0;
  });

}
/* ---- shelf helpers, used by the planner and the Build tab ---- */
const COMMON_ENZYME_SET = ["EcoRI","BamHI","HindIII","XhoI","SalI","NotI","NdeI","XbaI","SpeI","NheI",
  "BglII","PstI","SacI","KpnI","SmaI","XmaI","NcoI","EcoRV","AgeI","ClaI","PvuII","BsaI","BbsI","BsmBI"];
function ownedEnzymes(){ return Object.keys((state.reagents && state.reagents.enzymes) || {}); }
function tracksEnzymes(){ return ownedEnzymes().length > 0; }
function ownsEnzyme(n){ return !tracksEnzymes() || !!state.reagents.enzymes[n]; }
function enzymeStock(n){ return (state.reagents.enzymes || {})[n] || null; }
/* an oligo already in the freezer whose 3' end matches a designed primer */
function findMatchingOligo(seq){
  const s = cleanDNA(seq); if(s.length < 15) return null;
  const tail = s.slice(-18);
  return (state.reagents.oligos || []).find(o => {
    const os = cleanDNA(o.seq);
    return os.length >= 15 && (os.slice(-18) === tail || os === s);

}
function money(n){ const c = (state.rates && state.rates.currency) || "$";
  return c + (n >= 100 ? Math.round(n) : Math.round(n*100)/100); }

function seed(){

    "ATGGACTACAAGGACGACGATGACAAGGGTAGCGGTAGCGGTAGCGGTAGC" +
    "ATGGTGAGCAAGGGCGAGGAGCTGTTCACCGGGGTGGTGCCCATCCTGGTCGAGCTGGACGGCGACGTAAACGGCCACAAGTTCAGCGTGTCCGGCGAGGGCGAGGGCGATGCCACCTACGGCAAGCTGACCCTGAAGTTCATCTGCACCACCGGCAAGCTGCCCGTGCCCTGGCCCACCCTCGTGACCACCCTGACCTACGGCGTGCAGTGCTTCAGCCGCTACCCCGACCACATGAAGCAGCACGACTTCTTCAAGTCCGCCATGCCCGAAGGCTACGTCCAGGAGCGCACCATCTTCTTCAAGGACGACGGCAACTACAAGACCCGCGCCGAGGTGAAGTTCGAGGGCGACACCCTGGTGAACCGCATCGAGCTGAAGGGCATCGACTTCAAGGAGGACGGCAACATCCTGGGGCACAAGCTGGAGTACAACTACAACAGCCACAACGTCTATATCATGGCCGACAAGCAGAAGAACGGCATCAAGGTGAACTTCAAGATCCGCCACAACATCGAGGACGGCAGCGTGCAGCTCGCCGACCACTACCAGCAGAACACCCCCATCGGCGACGGCCCCGTGCTGCTGCCCGACAACCACTACCTGAGCACCCAGTCCGCCCTGAGCAAAGACCCCAACGAGAAGCGCGATCACATGGTCCTGCTGGAGTTCGTGACCGCCGCCGGGATCACTCTCGGCATGGACGAGCTGTACAAGTAA" +
    "CTCGAGCACCACCACCACCACCACTGAGATCCGGCTGCTAACAAAGCCCGAAAGGAAGCTGAGTTGGCTGCTGCCACCGCTGAGCAATAACTAGCATAACCCCTTGGGGCCTCTAAACGGGTCTTGAGGGGTTTTTTGGGATCCAAGCTT";
  return {
    v:3, view:"plasmids", pView:"home", curPlasmid:null, plasmids:[{
      id: uid(), name:"pDemo-FLAG-EGFP", type:"dna", topology:"circular", uniprot:"", seq: ex,
      ann: [], stock:[{id:uid(), kind:"miniprep", label:"clone 3", conc:214, vol:45, loc:"-20 box A / A4", date:today(), notes:"seq-verified"}],
      inSilico:false, tags:["demo"], created:today(), source:"built-in example"
    }]

}

/* ===================== 2. SEQUENCE PRIMITIVES ===================== */
function cleanDNA(s){ return (s||"").toUpperCase().replace(/[^ACGTN]/g,""); }
function cleanAA(s){ return (s||"").toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWYX*]/g,""); }

const COMP = {A:"T",T:"A",C:"G",G:"C",N:"N"};
function revComp(s){ let o=""; for(let i=s.length-1;i>=0;i--) o += COMP[s[i]] || "N"; return o; }
function gcPct(s){ if(!s.length) return 0; return (s.match(/[GC]/g)||[]).length / s.length * 100; }

const CODONS={TTT:"F",TTC:"F",TTA:"L",TTG:"L",CTT:"L",CTC:"L",CTA:"L",CTG:"L",ATT:"I",ATC:"I",ATA:"I",ATG:"M",
GTT:"V",GTC:"V",GTA:"V",GTG:"V",TCT:"S",TCC:"S",TCA:"S",TCG:"S",CCT:"P",CCC:"P",CCA:"P",CCG:"P",ACT:"T",ACC:"T",
ACA:"T",ACG:"T",GCT:"A",GCC:"A",GCA:"A",GCG:"A",TAT:"Y",TAC:"Y",TAA:"*",TAG:"*",CAT:"H",CAC:"H",CAA:"Q",CAG:"Q",
AAT:"N",AAC:"N",AAA:"K",AAG:"K",GAT:"D",GAC:"D",GAA:"E",GAG:"E",TGT:"C",TGC:"C",TGA:"*",TGG:"W",CGT:"R",CGC:"R",
CGA:"R",CGG:"R",AGT:"S",AGC:"S",AGA:"R",AGG:"R",GGT:"G",GGC:"G",GGA:"G",GGG:"G"};
function translate(s){ let p=""; for(let i=0;i+3<=s.length;i+=3) p += CODONS[s.substr(i,3)] || "X"; return p; }

/* E. coli-leaning codon table for back-translation of ordered fragments */
const BACK_ECOLI={A:"GCG",R:"CGT",N:"AAC",D:"GAT",C:"TGC",E:"GAA",Q:"CAG",G:"GGC",H:"CAT",I:"ATT",L:"CTG",K:"AAA",
M:"ATG",F:"TTT",P:"CCG",S:"AGC",T:"ACC",W:"TGG",Y:"TAT",V:"GTG","*":"TAA",X:"NNN"};
const BACK_HUMAN={A:"GCC",R:"AGA",N:"AAC",D:"GAC",C:"TGC",E:"GAG",Q:"CAG",G:"GGC",H:"CAC",I:"ATC",L:"CTG",K:"AAG",
M:"ATG",F:"TTC",P:"CCC",S:"AGC",T:"ACC",W:"TGG",Y:"TAC",V:"GTG","*":"TGA",X:"NNN"};
function backTranslate(aa, host){ const t = host==="human"?BACK_HUMAN:BACK_ECOLI; let o=""; for(const c of aa) o += t[c]||"NNN"; return o; }

/* Tm: quick Wallace/GC rule and nearest-neighbour (SantaLucia 1998 unified + salt correction) */
function tmQuick(s){ const n=s.length; if(!n) return null; const gc=(s.match(/[GC]/g)||[]).length;
  if(n<14) return 2*(n-gc)+4*gc; return Math.round((64.9+41*(gc-16.4)/n)*10)/10; }
const NN={AA:[-7.9,-22.2],TT:[-7.9,-22.2],AT:[-7.2,-20.4],TA:[-7.2,-21.3],CA:[-8.5,-22.7],TG:[-8.5,-22.7],
GT:[-8.4,-22.4],AC:[-8.4,-22.4],CT:[-7.8,-21.0],AG:[-7.8,-21.0],GA:[-8.2,-22.2],TC:[-8.2,-22.2],
CG:[-10.6,-27.2],GC:[-9.8,-24.4],GG:[-8.0,-19.9],CC:[-8.0,-19.9]};
function tmNN(seq, Ct, Na){
  seq = cleanDNA(seq); if(seq.length < 2) return null;
  Ct = Ct || 0.25e-6; Na = Na || 0.05;
  let dH=0, dS=0;
  [seq[0], seq[seq.length-1]].forEach(e => { if(e==="G"||e==="C"){ dH+=0.1; dS+=-2.8; } else { dH+=2.3; dS+=4.1; } });
  for(let i=0;i<seq.length-1;i++){ const nn=NN[seq.substr(i,2)]; if(nn){ dH+=nn[0]; dS+=nn[1]; } }
  const R=1.987, dSs = dS + 0.368*(seq.length-1)*Math.log(Na);
  return Math.round(((dH*1000)/(dSs + R*Math.log(Ct/4)) - 273.15)*10)/10;

/* protein stats */
const AAW={A:71.08,R:156.19,N:114.10,D:115.09,C:103.14,E:129.12,Q:128.13,G:57.05,H:137.14,I:113.16,L:113.16,
K:128.17,M:131.19,F:147.18,P:97.12,S:87.08,T:101.10,W:186.21,Y:163.18,V:99.13,X:110,"*":0};
function proteinMW(s){ let m=0; for(const a of s) m += AAW[a]||0; return s.length ? Math.round((m+18.02)/100)/10 : 0; }
/* Extinction coefficient at 280 nm (Pace 1995): 5500*W + 1490*Y + 125*C(cystine, reduced form ignored) */
function extCoeff(s){ const W=(s.match(/W/g)||[]).length, Y=(s.match(/Y/g)||[]).length, C=(s.match(/C/g)||[]).length;
  return { red: 5500*W + 1490*Y, ox: 5500*W + 1490*Y + 125*Math.floor(C/2), W, Y, C }; }
/* Isoelectric point by bisection on net charge (EMBOSS pK set) */
const PKA={ Cterm:3.65, Nterm:8.2, D:3.9, E:4.07, C:8.5, Y:10.46, H:6.04, K:10.54, R:12.48 };
function netCharge(s, pH){
  const n = c => (s.match(new RegExp(c,"g"))||[]).length;
  let ch = 1/(1+Math.pow(10, pH-PKA.Nterm)) - 1/(1+Math.pow(10, PKA.Cterm-pH));
  ch += n("K")/(1+Math.pow(10, pH-PKA.K)) + n("R")/(1+Math.pow(10, pH-PKA.R)) + n("H")/(1+Math.pow(10, pH-PKA.H));
  ch -= n("D")/(1+Math.pow(10, PKA.D-pH)) + n("E")/(1+Math.pow(10, PKA.E-pH))
      + n("C")/(1+Math.pow(10, PKA.C-pH)) + n("Y")/(1+Math.pow(10, PKA.Y-pH));
  return ch;
}
function pI(s){ let lo=0, hi=14; for(let i=0;i<80;i++){ const mid=(lo+hi)/2; if(netCharge(s,mid) > 0) lo=mid; else hi=mid; }
  return Math.round(((lo+hi)/2)*100)/100; }
/* GRAVY (Kyte-Doolittle) */
const KD={A:1.8,R:-4.5,N:-3.5,D:-3.5,C:2.5,Q:-3.5,E:-3.5,G:-0.4,H:-3.2,I:4.5,L:3.8,K:-3.9,M:1.9,F:2.8,P:-1.6,
S:-0.8,T:-0.7,W:-0.9,Y:-1.3,V:4.2,X:0,"*":0};
function gravy(s){ if(!s.length) return 0; let t=0; for(const a of s) t += (KD[a]||0); return Math.round(t/s.length*1000)/1000; }

/* ORFs across 6 frames */
function findORFs(seq, minAA){
  minAA = minAA || 50; const out=[];

        if(ss.substr(i,3) === "ATG"){

}

/* ==== 20-enzymes.js ==== */
/* ===================== 3. ENZYME LIBRARY =====================

   c   = top-strand cut position, counted from the 5' end of the site

const ENZ = {
  EcoRI:{s:"GAATTC",c:1}, BamHI:{s:"GGATCC",c:1}, HindIII:{s:"AAGCTT",c:1}, XhoI:{s:"CTCGAG",c:1},
  SalI:{s:"GTCGAC",c:1},  NotI:{s:"GCGGCCGC",c:2}, NdeI:{s:"CATATG",c:2}, XbaI:{s:"TCTAGA",c:1,dam:"overlapping GATC"},
  SpeI:{s:"ACTAGT",c:1},  NheI:{s:"GCTAGC",c:1},  AvrII:{s:"CCTAGG",c:1}, BglII:{s:"AGATCT",c:1},
  BclI:{s:"TGATCA",c:1,dam:"always in dam+ strains"}, PstI:{s:"CTGCAG",c:5}, SacI:{s:"GAGCTC",c:5},
  KpnI:{s:"GGTACC",c:5},  SmaI:{s:"CCCGGG",c:3},  XmaI:{s:"CCCGGG",c:1}, NcoI:{s:"CCATGG",c:1},
  EcoRV:{s:"GATATC",c:3}, ApaI:{s:"GGGCCC",c:5},  AflII:{s:"CTTAAG",c:1}, AscI:{s:"GGCGCGCC",c:2},
  PacI:{s:"TTAATTAA",c:5},SphI:{s:"GCATGC",c:5},  MluI:{s:"ACGCGT",c:1}, SbfI:{s:"CCTGCAGG",c:6},
  AgeI:{s:"ACCGGT",c:1},  BsrGI:{s:"TGTACA",c:1}, ClaI:{s:"ATCGAT",c:2,dam:"overlapping GATC"},
  HpaI:{s:"GTTAAC",c:3},  PvuII:{s:"CAGCTG",c:3}, StuI:{s:"AGGCCT",c:3}, ScaI:{s:"AGTACT",c:3},
  DraI:{s:"TTTAAA",c:3},  SnaBI:{s:"TACGTA",c:3}, FseI:{s:"GGCCGGCC",c:6}, SwaI:{s:"ATTTAAAT",c:4},
  PmeI:{s:"GTTTAAAC",c:4},NsiI:{s:"ATGCAT",c:5},  BstBI:{s:"TTCGAA",c:2}, EagI:{s:"CGGCCG",c:1},
  BsaI:{s:"GGTCTC",c:null,iis:true,off:[1,5]}, BbsI:{s:"GAAGAC",c:null,iis:true,off:[2,6]},
  BsmBI:{s:"CGTCTC",c:null,iis:true,off:[1,5]}, SapI:{s:"GCTCTTC",c:null,iis:true,off:[1,4]}

/* overhang produced by a palindromic type II enzyme */
function overhangOf(name){

  return { type:"3'", seq: e.s.slice(L - e.c, e.c) };

function endsCompatible(a, b){
  const oa = overhangOf(a), ob = overhangOf(b);

  if(oa.type === "blunt" && ob.type === "blunt") return true;
  return oa.type === ob.type && oa.seq === ob.seq;

/* all cut sites of one enzyme in a sequence (linear scan, both strands are equivalent for palindromes) */
function sitesOf(name, seq, circular){
  const e = ENZ[name]; if(!e) return [];

/* fragment sizes from a (possibly multi-enzyme) digest - what you would see on a gel */
function fragments(seq, circular, names){

  names.forEach(n => sitesOf(n, seq, circular).forEach(s => cuts.push(s.cut)));
  const u = [...new Set(cuts)].sort((a,b) => a-b);
  if(!u.length) return [{ size: seq.length, note: circular ? "uncut (circular)" : "uncut (linear)" }];
  const out = [];
  if(circular){
    for(let i=0;i<u.length;i++){
      const a = u[i], b = u[(i+1) % u.length];
      out.push({ size: (b - a + seq.length) % seq.length || seq.length, from:a, to:b });
    }
  } else {
    let prev = 0;
    u.forEach(c => { out.push({ size: c - prev, from:prev, to:c }); prev = c; });
    out.push({ size: seq.length - prev, from:prev, to:seq.length });
  }
  return out.filter(f => f.size > 0).sort((a,b) => b.size - a.size);
}

/* ===================== 4. ANNOTATION ENGINE ===================== */
function findMotifs(seq, name, variants, circular){
  const out = [];
  const hay = circular ? seq + seq : seq;
  variants.forEach(v => {
    [[1, hay], [-1, revComp(hay)]].forEach(([strand, s]) => {
      let i = s.indexOf(v);
      while(i !== -1){
        let start, end;
        if(strand === 1){ start = i; end = i + v.length - 1; }
        else { end = hay.length - 1 - i; start = hay.length - i - v.length; }
        if(start < seq.length){
          const st = start % seq.length;
          const wraps = end >= seq.length;
          const en = wraps ? seq.length - 1 : end;      // clamp rather than wrap so coordinates stay ordered
          if(!out.some(o => o.start === st && o.strand === strand)) out.push({ name, start:st, end:en, strand, wraps });
        }
        i = s.indexOf(v, i + 1);
      }
    });
  });
  return out;
}
function detectDNAFeatures(seq, circular, cats){
  let out = [];
  DNA_FEATURES.filter(f => !cats || cats.includes(f.cat)).forEach(f => {
    if(f.weak) return;
    findMotifs(seq, f.name, f.seqs, circular).forEach(h => out.push(Object.assign(h, { cat:f.cat, how:"exact motif" })));
  });
  return out;
}
function detectRestrictionSites(seq, circular){
  const out = [];
  Object.keys(ENZ).forEach(n => {
    sitesOf(n, seq, circular).forEach(s =>
      out.push({ name:n, start:s.siteStart, end:s.siteStart + ENZ[n].s.length - 1, strand:1, cat:"site", how:"exact site" }));
  });
  return out;
}
/* protein-level detection over all six frames */
function detectProteinSignatures(seq, circular){
  const out = [];
  const src = circular ? seq + seq.slice(0, Math.min(seq.length, 3000)) : seq;
  [[1, src], [-1, revComp(src)]].forEach(([strand, ss]) => {
    for(let f=0; f<3; f++){
      const prot = translate(ss.slice(f));
      PROT_SIGS.forEach(sig => {
        let i = prot.indexOf(sig.pep);
        while(i !== -1){
          const ntStart = f + i*3, ntEnd = ntStart + sig.pep.length*3 - 1;
          let start, end;
          if(strand === 1){ start = ntStart; end = ntEnd; }
          else { end = src.length - 1 - ntStart; start = src.length - 1 - ntEnd; }
          if(start < seq.length && start >= 0){
            const st = start % seq.length;
            const en = Math.min(end, seq.length - 1);
            if(!out.some(o => o.start === st && o.name === sig.name))
              out.push({ name:sig.name, start:st, end:en, strand, cat:sig.cat, how:"protein signature" });
          }
          i = prot.indexOf(sig.pep, i + 1);
        }
      });
    }
  });
  return out;
}
/* sequences you have taught it: exact matches, either strand, like the built-ins */
function detectCustomFeatures(seq, circular){
  let out = [];
  (state.features || []).forEach(f => {
    const v = cleanDNA(f.seq);
    if(v.length < 8) return;
    findMotifs(seq, f.name, [v], circular).forEach(h =>
      out.push(Object.assign(h, { cat: f.kind || "custom", how: "your feature library" })));
  });
  return out;
}

/* matches to features you have already labelled on your other constructs */
function detectFromWorkspace(seq, circular, excludeId){
  let out = [];
  state.plasmids.forEach(op => {
    if(op.id === excludeId || op.type === "protein") return;
    const os = seqOf(op);
    (op.ann || []).forEach(a => {
      const sub = os.slice(a.start, a.end + 1);
      if(sub.length < 18) return;
      findMotifs(seq, a.label, [sub], circular).forEach(h =>
        out.push(Object.assign(h, { cat:"workspace", how:"matches “" + a.label + "” on " + op.name })));
    });
  });
  return out;
}
/* the full pre-check that runs on upload */
function autoAnnotate(seq, circular, excludeId){
  const feats = detectCustomFeatures(seq, circular)
    .concat(detectDNAFeatures(seq, circular))
    .concat(detectProteinSignatures(seq, circular))
    .concat(detectFromWorkspace(seq, circular, excludeId));
  // ORFs that could plausibly be a gene, rather than every stretch without a stop codon
  plausibleORFs(seq).forEach(o =>
    feats.push({ name:"ORF " + o.len + " aa (" + (o.strand===1?"+":"-") + ")", start:o.start, end:o.end,
                 strand:o.strand, cat:"orf", likely:o.likely,
                 how:"open reading frame, " + o.len + " codons" + (o.likely ? "" : " - may be chance") }));
  // collapse duplicates that cover the same span with the same name
  const seen = new Set(), uniq = [];
  feats.forEach(f => { const k = f.name + ":" + f.start + ":" + f.end; if(!seen.has(k)){ seen.add(k); uniq.push(f); } });
  uniq.sort((a,b) => a.start - b.start);
  return uniq;
}

  origin:"#d6f0f5", enzyme:"#f3d6f5", orf:"#e8e2ff", site:"#fff2b3", workspace:"#ffd9c2", custom:"#cfe8ff" };

/* Six-frame ORF finding produces a lot of noise: on any sequence, some frames run
   a long way without hitting a stop by chance. Keep the ones that could actually be
   a gene - long, and not sitting inside a longer one - and mark how confident that is.
   At 100 codons a random frame is very unlikely to stay open (P(no stop) ~ 0.95^100),
   so that is the floor; only the ones well above it are ticked by default. */
function plausibleORFs(seq, minAA){
  minAA = minAA || 100;
  const all = findORFs(seq, minAA);              // already sorted longest first
  const keep = [];
  all.forEach(o => {
    const len = o.end - o.start + 1;
    const buried = keep.some(k => {
      const ov = Math.min(k.end, o.end) - Math.max(k.start, o.start) + 1;
      return ov > 0 && ov / len > 0.5;           // mostly inside something we already kept
    });
    if(!buried) keep.push(o);
  });
  const longest = keep.length ? keep[0].len : 0;
  return keep.slice(0, 4).map(o => Object.assign({}, o, {
    likely: o.len >= 150 || o.len === longest
  }));
}

/* ===================== 5. ALIGNMENT ENGINE =====================
   Seed-and-extend: exact k-mer seeds pick the diagonal, then a full
   semi-global DP inside a window around it (free gaps at both reference
   ends, the query is aligned end to end). Handles both strands and the
   circular junction.
*/
function kmerIndex(seq, k){
  const m = new Map();
  for(let i=0; i+k <= seq.length; i++){
    const s = seq.substr(i, k);
    let a = m.get(s); if(!a){ a = []; m.set(s, a); }
    if(a.length < 500) a.push(i);
  }
  return m;
}
function bestDiagonal(idx, q, k){
  const votes = new Map();
  for(let j=0; j+k <= q.length; j += Math.max(1, Math.floor(k/3))){
    const hits = idx.get(q.substr(j, k));
    if(!hits || hits.length > 60) continue;
    hits.forEach(i => { const d = i - j; votes.set(d, (votes.get(d)||0) + 1); });
  }
  let best = null, bestN = 0;
  // pool neighbouring diagonals so small indels do not split the vote
  const keys = [...votes.keys()].sort((a,b)=>a-b);
  keys.forEach(d => {
    let n = 0;
    for(let dd = d - 12; dd <= d + 12; dd++) n += votes.get(dd) || 0;
    if(n > bestN){ bestN = n; best = d; }
  });
  return { diag: best, votes: bestN };
}
const SC = { match:2, mismatch:-4, gap:-6 };
function semiGlobal(ref, qry){
  // ref may be longer than qry; leading/trailing ref gaps are free
  const n = qry.length, m = ref.length;
  if(n === 0 || m === 0) return null;
  const W = m + 1;
  const H = new Int32Array((n+1) * W);
  const T = new Uint8Array((n+1) * W);   // 0 diag, 1 up (gap in ref), 2 left (gap in qry)
  for(let j=0; j<=m; j++){ H[j] = 0; T[j] = 2; }
  for(let i=1; i<=n; i++){ H[i*W] = SC.gap * i; T[i*W] = 1; }
  for(let i=1; i<=n; i++){
    const qc = qry[i-1], row = i*W, prev = (i-1)*W;
    for(let j=1; j<=m; j++){
      const d = H[prev + j - 1] + (ref[j-1] === qc ? SC.match : SC.mismatch);
      const u = H[prev + j] + SC.gap;
      const l = H[row + j - 1] + SC.gap;
      let best = d, t = 0;
      if(u > best){ best = u; t = 1; }
      if(l > best){ best = l; t = 2; }
      H[row + j] = best; T[row + j] = t;
    }
  }
  let endJ = 0, bestScore = -Infinity;
  for(let j=0; j<=m; j++){ if(H[n*W + j] >= bestScore){ bestScore = H[n*W + j]; endJ = j; } }
  let i = n, j = endJ, ar = "", aq = "";
  while(i > 0){
    const t = T[i*W + j];
    if(t === 0){ ar = ref[j-1] + ar; aq = qry[i-1] + aq; i--; j--; }
    else if(t === 1){ ar = "-" + ar; aq = qry[i-1] + aq; i--; }
    else { ar = ref[j-1] + ar; aq = "-" + aq; j--; }
    if(j < 0) break;
  }
  return { alnRef: ar, alnQry: aq, score: bestScore, refStart: j, refEnd: endJ - 1 };
}
function alignToPlasmid(p, rawQuery){
  const ref = seqOf(p), circular = p.topology === "circular" && p.type === "dna";
  const query = cleanDNA(rawQuery);
  if(!ref.length || !query.length) return { error:"Need both a reference and a query sequence." };
  // the DP matrix is quadratic, so a very long query is refused rather than freezing the tab
  if(query.length > 4000) return { error:"Query is " + query.length + " bp. Alignment here is capped at 4 kb - split a long read into pieces." };
  const k = Math.max(8, Math.min(14, Math.floor(Math.log(ref.length) / Math.log(4)) + 3));
  const searchRef = circular ? ref + ref : ref;
  const idx = kmerIndex(searchRef, k);
  let best = null;
  [["+", query], ["-", revComp(query)]].forEach(([strand, q]) => {
    const d = bestDiagonal(idx, q, k);
    if(d.diag === null) return;
    if(!best || d.votes > best.votes) best = { strand, q, diag:d.diag, votes:d.votes };
  });
  if(!best || best.votes < 2)
    return { error:"No seed match found. This sequence does not appear to come from this construct (checked both strands)." };
  const pad = Math.max(40, Math.ceil(best.q.length * 0.12));
  let from = Math.max(0, best.diag - pad);
  let to = Math.min(searchRef.length, best.diag + best.q.length + pad);
  const win = searchRef.slice(from, to);
  const aln = semiGlobal(win, best.q);
  if(!aln) return { error:"Alignment failed." };
  const refStart = from + aln.refStart, refEnd = from + aln.refEnd;
  // walk the alignment and record every difference in reference coordinates
  const diffs = [];
  let rp = refStart, ident = 0, aligned = 0;
  for(let i=0; i<aln.alnRef.length; i++){
    const r = aln.alnRef[i], q = aln.alnQry[i];
    if(r === "-"){ diffs.push({ type:"insertion", pos: rp, ref:"-", qry:q }); }
    else if(q === "-"){ diffs.push({ type:"deletion", pos: rp, ref:r, qry:"-" }); rp++; aligned++; }
    else {
      aligned++;
      if(r === q) ident++; else diffs.push({ type:"substitution", pos: rp, ref:r, qry:q });
      rp++;
    }
  }
  // merge runs of adjacent indels into single events
  const merged = [];
  diffs.forEach(d => {
    const last = merged[merged.length-1];
    if(last && last.type === d.type && d.type !== "substitution" && d.pos <= last.pos + last.ref.length + 1 && last.pos + (last.qry === "-" ? last.ref.length : last.qry.length) >= d.pos){
      last.ref = last.ref === "-" ? "-" : last.ref + (d.ref === "-" ? "" : d.ref);
      last.qry = last.qry === "-" ? "-" : last.qry + (d.qry === "-" ? "" : d.qry);
    } else merged.push(Object.assign({}, d));
  });
  return {
    strand: best.strand, refStart, refEnd, refLen: ref.length, circular,
    alnRef: aln.alnRef, alnQry: aln.alnQry, score: aln.score,
    identity: aligned ? ident/aligned*100 : 0, matches: ident, aligned,
    diffs: merged, queryLen: query.length,
    wraps: circular && refEnd >= ref.length
  };
}
function annotationsAt(p, pos){
  const L = seqOf(p).length, x = ((pos % L) + L) % L;
  return (p.ann || []).filter(a => x >= a.start && x <= a.end);
}

/* =========================================================================
   POLYMERASES
   Each vendor publishes its own rule of thumb for turning a primer Tm into an
   annealing temperature, and its own extension rate. The Tm underneath is a
   SantaLucia nearest-neighbour value, NOT the vendor's own model - NEB's Q5 and
   Phusion calculators in particular run warmer, so expect a degree or two of
   disagreement and run a gradient if a reaction is marginal.

   proofreading matters for more than fidelity: Taq leaves a 3' A overhang, so
   its product cannot be blunt-ligated and is useless for KLD mutagenesis.
   ========================================================================= */
const POLYMERASES = {
  Q5:        { label:"Q5 / Q5 Hot Start", vendor:"NEB", proofreading:true, sPerKb:25,
               taOffset:1,  note:"Q5's buffer raises the effective Tm; NEB's own calculator usually suggests a slightly higher Ta than a plain nearest-neighbour value." },
  Phusion:   { label:"Phusion", vendor:"NEB/Thermo", proofreading:true, sPerKb:30,
               taOffset:3, shortOffset:0,
               note:"NEB's published rule: Ta = Tm of the lower primer + 3 °C for primers over 20 nt, or the Tm itself for primers 20 nt and under." },
  KOD:       { label:"KOD / KOD Hot Start", vendor:"Merck", proofreading:true, sPerKb:15,
               taOffset:0,  note:"Fast and tolerant of GC-rich templates. Anneal at the lower primer's Tm." },
  PrimeSTAR: { label:"PrimeSTAR GXL", vendor:"Takara", proofreading:true, sPerKb:60,
               taOffset:0,  note:"Robust on long and difficult templates; a 2-step protocol at 68 °C often works." },
  Pfu:       { label:"Pfu / PfuUltra", vendor:"Agilent", proofreading:true, sPerKb:120,
               taOffset:-2, note:"Slow. Allow two minutes per kb and expect a longer run." },
  Taq:       { label:"Taq", vendor:"various", proofreading:false, sPerKb:60,
               taOffset:-5, note:"No proofreading, and it leaves a 3' A overhang - the product will not blunt-ligate, so it cannot be used for KLD mutagenesis." },
  OneTaq:    { label:"OneTaq", vendor:"NEB", proofreading:false, sPerKb:60,
               taOffset:-5, note:"A Taq blend. Same A-overhang problem for blunt ligation." }
};
function polymerase(id){ return POLYMERASES[id] || POLYMERASES.Q5; }
function defaultPolymerase(){ return (state.lab && state.lab.polymerase) || "Q5"; }
/* vendor rule applied to a nearest-neighbour Tm */
function annealTempFor(polyId, tmLow, primerLen){
  const P = polymerase(polyId);
  let off = P.taOffset;
  if(P.shortOffset !== undefined && primerLen && primerLen <= 20) off = P.shortOffset;
  return Math.round(tmLow + off);
}
/* the Tm each primer must reach for a wanted annealing temperature */
function tmNeededFor(polyId, targetTa, primerLen){
  const P = polymerase(polyId);
  let off = P.taOffset;
  if(P.shortOffset !== undefined && primerLen && primerLen <= 20) off = P.shortOffset;
  return targetTa - off;
}

/* The shortest primer that clears a Tm, rather than the first round number.
   Up to two extra bases are allowed to land a 3' G or C, which is worth it;
   beyond that a longer primer just costs more and synthesises worse. */
function pickAnnealFor(template, needTm, opts){
  opts = opts || {};
