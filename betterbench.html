function loadCreateFile(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let txt = String(r.result);
    let name = f.name.replace(/\.[^.]+$/, "");
    if(/^LOCUS/m.test(txt)){                       // very light GenBank handling: take ORIGIN block
      const m = txt.split(/^ORIGIN/m)[1];
      if(m) txt = m.replace(/\/\//g, "");
      const loc = txt.match(/^LOCUS\s+(\S+)/m); if(loc) name = loc[1];
    }
    const lines = txt.split(/\r?\n/);
    if(lines[0] && lines[0].startsWith(">")){ name = lines[0].slice(1).trim().split(/\s+/)[0] || name; txt = lines.slice(1).join(""); }
    const ta = document.getElementById("cr-seq"); if(ta) ta.value = txt;
    const nm = document.getElementById("cr-name"); if(nm && !nm.value) nm.value = name;
  };
  r.readAsText(f);
}

/* ===================== auto-annotation pre-check ===================== */
function runAutoAnnotate(){
  const p = curP(); if(!p || p.type !== "dna"){ alert("The pre-check runs on DNA sequences."); return; }
  const seq = seqOf(p);
  const feats = autoAnnotate(seq, p.topology === "circular", p.id);
  const sites = detectRestrictionSites(seq, p.topology === "circular");
  const counts = {}; sites.forEach(s => counts[s.name] = (counts[s.name]||0) + 1);
  pendingAuto = {
    feats: feats.map(f => ({ f, on: f.cat !== "orf" || !!f.likely })),
    unique: Object.keys(counts).filter(n => counts[n] === 1).sort(),
    siteCount: sites.length, enzymeCount: Object.keys(counts).length
  };
  render();
}
function autoAnnotateModal(){
  if(!pendingAuto) return "";
  const p = curP(); if(!p) return "";
  const groups = {};
  pendingAuto.feats.forEach((row, i) => { (groups[row.f.cat] = groups[row.f.cat] || []).push([row, i]); });
  const order = ["marker","reporter","promoter","element","tag","origin","enzyme","orf","workspace"];
  const titles = { marker:"Resistance markers", reporter:"Reporters", promoter:"Promoters & regulatory",
    element:"Elements", tag:"Tags & cleavage sites", origin:"Origins", enzyme:"Enzymes",
    orf:"Open reading frames", workspace:"Matches to your other constructs" };
  const body = order.filter(k => groups[k]).map(k => `
    <div style="margin-bottom:16px">
      <div class="lblrow">
        <h3 style="margin:0">${titles[k]} <span class="muted small">(${groups[k].length})</span></h3>
        <button class="ghost" onclick="autoToggleGroup('${k}')">toggle all</button>
      </div>
      ${GROUP_HELP[k] ? `<div class="muted small" style="margin:4px 0 8px;line-height:1.5;max-width:70ch">${GROUP_HELP[k]}</div>` : ""}
      ${groups[k].map(([row, i]) => `
        <label class="obrow ${row.on?"on":""}" data-row="${i}"
               onmousedown="autoRowDown(${i},event)" onmouseenter="autoRowEnter(${i})">
          <input type="checkbox" data-auto="${i}" style="width:auto;pointer-events:none" ${row.on?"checked":""}>
          <span style="flex:1">${esc(row.f.name)}</span>
          <span class="muted small">${row.f.start+1}–${row.f.end+1} · ${row.f.strand===1?"+":"−"} · ${esc(row.f.how)}</span>
        </label>`).join("")}
    </div>`).join("") || `<p class="muted">Nothing recognised. That is normal for a fragment with no standard parts.</p>`;
  const on = pendingAuto.feats.filter(r => r.on).length;
  return `<div class="modalbg" onclick="if(event.target===this){pendingAuto=null;render()}">
    <div class="modal">
      <div class="lblrow"><h2 style="margin:0">Pre-check: ${esc(p.name)}</h2>
        <button class="ghost" onclick="pendingAuto=null;render()">Close</button></div>
      <p class="muted" style="margin:8px 0 16px">
        ${seqOf(p).length} bp scanned. ${pendingAuto.siteCount} restriction sites from
        ${pendingAuto.enzymeCount} enzymes, ${pendingAuto.unique.length} of them unique cutters.
        Matches below come from your feature library, exact motifs, six-frame protein signatures, and your own
        labelled constructs —
        they are seeds, not validated full-length annotations, so check anything you will rely on.</p>
      <div class="note info" style="margin-bottom:14px"><b>Unique cutters:</b>
        ${pendingAuto.unique.length ? pendingAuto.unique.join(", ") : "none"}</div>
      ${body}
      ${featureTeachPanel()}
      <div class="muted small" style="margin:10px 0 2px">Click a row to toggle it. <b>Click and drag</b> down a list
        to change several at once, or <b>shift-click</b> to set everything between two rows.</div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;position:sticky;bottom:-22px;
                  background:var(--panel);padding:10px 0 2px;border-top:1px solid var(--line2)">
        <button class="primary" onclick="applyAuto()">Add <span id="autoCount">${on}</span> annotation${on===1?"":"s"}</button>
        <button class="ghost" onclick="pendingAuto.feats.forEach(r=>r.on=true);render()">Select all</button>
        <button class="ghost" onclick="pendingAuto.feats.forEach(r=>r.on=false);render()">Select none</button>
      </div>
    </div></div>`;
}
function applyAuto(){
  const p = curP(); if(!p || !pendingAuto) return;
  let n = 0;
  pendingAuto.feats.filter(r => r.on).forEach(r => {
    const f = r.f;
    if(p.ann.some(a => a.start === f.start && a.end === f.end && a.label === f.name)) return;
    p.ann.push({ id:uid(), start:f.start, end:f.end, label:f.name, color:CAT_COLOR[f.cat] || PALETTE[p.ann.length % PALETTE.length],
                 kind:f.cat, strand:f.strand, how:f.how });
    n++;
  });
  p.ann.sort((a,b) => a.start - b.start);
  pendingAuto = null; save(); render(); toast("Added " + n + " annotation" + (n===1?"":"s"));
}


/* ---- what each group of hits actually is ---- */
const GROUP_HELP = {
  orf: "An <b>open reading frame</b> is a stretch that could be translated into protein: it starts at an ATG " +
       "and runs to a stop codon. BetterBench checks all six reading frames, so a long sequence throws up several " +
       "even when only one is a real gene. Only the convincing ones are ticked for you - the rest are listed in " +
       "case they matter, but a short ORF on the reverse strand is usually just chance.",
  workspace: "Regions you have already labelled on your other constructs, found again here.",
  marker: "Antibiotic resistance genes, matched on the protein sequence rather than the DNA, so a recoded version still matches."
};

/* ---- click, drag or shift-click to select rows in the pre-check ---- */
let autoDrag = null, autoLastRow = null;
function autoRowDown(i, e){
  if(e) e.preventDefault();
  if(e && e.shiftKey && autoLastRow !== null){
    const a = Math.min(autoLastRow, i), b = Math.max(autoLastRow, i);
    const v = !pendingAuto.feats[i].on;
    for(let k = a; k <= b; k++) setAutoRow(k, v);
    autoLastRow = i;
    return;
  }
  const v = !pendingAuto.feats[i].on;
  autoDrag = { value: v };
  setAutoRow(i, v);
  autoLastRow = i;
  window.addEventListener("mouseup", autoDragEnd, { once:true });
}
function autoRowEnter(i){ if(autoDrag) setAutoRow(i, autoDrag.value); }
function autoDragEnd(){ autoDrag = null; }
function setAutoRow(i, v){
  if(!pendingAuto || !pendingAuto.feats[i]) return;
  pendingAuto.feats[i].on = v;
  const cb = document.querySelector('[data-auto="' + i + '"]');
  if(cb) cb.checked = v;
  const row = document.querySelector('[data-row="' + i + '"]');
  if(row) row.classList.toggle("on", v);
  const n = document.getElementById("autoCount");
  if(n) n.textContent = pendingAuto.feats.filter(r => r.on).length;
}
function autoToggleGroup(cat){
  const rows = pendingAuto.feats.map((r,i) => [r,i]).filter(([r]) => r.f.cat === cat);
  const allOn = rows.every(([r]) => r.on);
  rows.forEach(([,i]) => setAutoRow(i, !allOn));
}

  if(!showDetails || sel.start === null || sel.end === null)
    return `<div class="sidecard"><span class="muted small">Select a region and choose “Details” to see stats,
      restriction sites and extension times here.</span></div>`;
  const sub = seq.slice(sel.start, sel.end + 1), n = sub.length;
  const close = `<button class="comp-x" onclick="showDetails=false;render()">✕</button>`;
  if(p.type === "protein"){
    const e = extCoeff(sub);
    return `<div class="sidecard"><div class="lblrow"><h2 style="margin:0">Details</h2>${close}</div>
      <div style="margin-top:8px">
        <span class="stat">Length <b>${n}</b> aa</span><span class="stat">MW <b>${proteinMW(sub)}</b> kDa</span>
        <span class="stat">pI <b>${pI(sub)}</b></span><span class="stat">GRAVY <b>${gravy(sub)}</b></span></div>
      <details class="fold"><summary>A280 / quantification</summary>
        <div class="muted small" style="padding-top:6px">ε(reduced) ${e.red} M⁻¹cm⁻¹ ·
        1 mg/mL ≈ A280 ${(e.red/(proteinMW(sub)*1000)).toFixed(2)}</div></details>
      </div>`;
  }
  const gc = gcPct(sub).toFixed(1);
  const whole = digestMap(seq, p.topology === "circular");
  const inside = {};
  Object.keys(whole).forEach(nme => {
    const hits = whole[nme].filter(s => s.siteStart >= sel.start && s.siteStart <= sel.end);
    if(hits.length) inside[nme] = { hits, total: whole[nme].length };
  });
  const enzHTML = Object.keys(inside).length ? Object.keys(inside).sort().map(nme => {
    const d = inside[nme], uniq = d.total === 1;
    return `<div style="margin:3px 0"><b>${nme}</b> @ ${d.hits.map(h => h.siteStart+1).join(", ")} ·
      <span style="color:${uniq?'var(--green)':'var(--muted)'}">${uniq ? "unique" : d.total + "× in construct"}</span>
      ${ENZ[nme].dam ? `<span class="pill amber" title="Dam methylation">dam</span>` : ""}</div>`;
  }).join("") : '<span class="muted small">No sites in this region.</span>';
  const rows = Object.keys(POLYMERASES).map(k => { const e = POLYMERASES[k];
    return `<tr${k === defaultPolymerase() ? ' style="background:var(--accent-soft)"' : ""}>
      <td>${esc(e.label.split(" / ")[0])}</td>
      <td>${e.proofreading ? "high-fidelity" : "no proofreading"}</td>
      <td><b>${fmtTime(e.sPerKb*n/1000)}</b></td></tr>`; }).join("");
  const orf = longestORF(sub);
  const overl = (p.ann||[]).filter(a => a.start <= sel.end && a.end >= sel.start);
  return `<div class="sidecard"><div class="lblrow"><h2 style="margin:0">Details</h2>${close}</div>
    <div style="margin-top:8px"><span class="stat"><b>${n}</b> bp</span><span class="stat">GC <b>${gc}%</b></span>
      <span class="stat">Tm <b>${tmNN(sub.slice(0,40))}°C</b></span></div>
    ${overl.length ? `<label>Overlaps</label><div class="small">${overl.map(a =>
        `<span class="pill grey" style="margin:2px 2px 0 0">${esc(a.label)}</span>`).join("")}</div>` : ""}
    ${orf.len ? `<details class="fold"><summary>Longest ORF here</summary><div class="muted small" style="padding-top:6px">${orf.len} aa · ${proteinMW(orf.prot)} kDa
      <button class="ghost" style="margin-left:4px" onclick="copyText(longestORF(seqOf(curP()).slice(${sel.start},${sel.end+1})).prot,'Protein')">copy</button></div></details>` : ""}
    <details class="fold"><summary>Restriction sites here <span class="muted small">${Object.keys(inside).length}</span></summary>
      <div style="padding-top:6px">${enzHTML}</div></details>
    <details class="fold"><summary>PCR extension time</summary>
      <table><thead><tr><th>Pol</th><th>Type</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></details>
    </div>`;
}

/* ---- provenance: what this construct was made from, and what came out of it ---- */
function lineageBar(p){
  const parents = (p.parents || []).filter(x => x.name);
  const children = state.plasmids.filter(c => (c.parents||[]).some(x => x.id === p.id));

/* ==== 52-features.js ==== */
/* =========================================================================
   YOUR FEATURE LIBRARY
   The built-in motif list only knows common parts. Anything your lab actually
   uses - a polyhedrin promoter, a house linker, a strain-specific marker -
   goes here, and the pre-check finds it on every construct from then on.
   ========================================================================= */

const FEATURE_KINDS = ["promoter","terminator","tag","marker","origin","element","reporter","cds","custom"];

function addFeature(name, seq, kind, note){
  const s = cleanDNA(seq);
  if(!name || !s) return null;
  if(s.length < 8) return { error: "Too short to search for reliably - 8 bases is the floor, and under about 15 you will get chance hits." };
  const dup = (state.features || []).find(f => cleanDNA(f.seq) === s);
  if(dup) return { error: "You already have that sequence, saved as “" + dup.name + "”." };
  const f = { id:uid(), name:name.trim(), kind: FEATURE_KINDS.includes(kind) ? kind : guessKind(name),
              seq:s, note:note || "", created:today() };
  state.features.push(f); save();
  return { feature:f };
}
function delFeature(id){
  state.features = (state.features || []).filter(f => f.id !== id);
  save(); render();
}
/* from the pre-check panel */
function addFeatureFromPanel(){
  const name = val("nf-name").trim(), seq = val("nf-seq"), kind = val("nf-kind");
  if(!name){ toast("Give it a name"); return; }
  const r = addFeature(name, seq, kind);
  if(!r){ toast("Needs a name and a sequence"); return; }
  if(r.error){ alert(r.error); return; }
  // re-run so the new feature shows up immediately in the list they are looking at
  const p = curP();
  if(p && pendingAuto) runAutoAnnotate();
  else render();
  toast("Added “" + r.feature.name + "” - the pre-check will find it from now on");
}
/* from a selection on the map */
function teachFromSelection(){
  const p = curP(); if(!p || sel.start === null || sel.end === null) return;
  const seq = seqOf(p).slice(sel.start, sel.end + 1);
  const hit = (p.ann || []).find(a => a.start === sel.start && a.end === sel.end);
  const name = prompt("What is this? The pre-check will label it with this name on every construct.",
                      hit ? hit.label : "");
  if(!name) return;
  const r = addFeature(name, seq, hit ? hit.kind : null);
  if(r && r.error){ alert(r.error); return; }
  showMenu = false; render();
  toast("Added to your feature library");
}
/* promote an existing annotation straight from the components list */
function teachFromAnnotation(aid){
  const p = curP(); if(!p) return;
  const a = (p.ann || []).find(x => x.id === aid); if(!a) return;
  const r = addFeature(a.label, seqOf(p).slice(a.start, a.end + 1), a.kind);
  if(!r){ toast("Could not add that"); return; }
  if(r.error){ toast(r.error); return; }
  render();
  toast("“" + a.label + "” will now be found automatically");
}
function featureKnown(p, a){
  const s = seqOf(p).slice(a.start, a.end + 1);
  return (state.features || []).some(f => cleanDNA(f.seq) === s);
}

      </tbody></table></div>
      <div style="margin-top:10px"><button class="ghost" onclick="closeMake();go('design')">Build it from parts →</button></div>`;
  }
  return `<div class="panel" style="margin:14px 0 0;box-shadow:none">

/* hand the winning mutagenesis plan to the full editor */
function openMakeInMutate(){
  const r = makeCache.routes[makePick];
  if(!r || !r.parent || !r.edit) return;
  mutState.templateId = r.parent.id;

  mutState.ntKind = r.edit.kind;

/* ==== 55-render.js ==== */
/* ===================== renderers ===================== */
function renderLinear(seq, p){
  const per = 60, ann = p.ann || [];
  const bg = i => { for(const a of ann) if(i >= a.start && i <= a.end) return a.color; return null; };
  const inSel = i => sel.start === null ? false : (sel.end === null ? i === sel.start : (i >= sel.start && i <= sel.end));
  let h = "";
  for(let line = 0; line*per < seq.length; line++){
    const sp = line*per;
    h += `<div class="seqline"><span class="pos">${String(sp+1).padStart(6)}</span><span class="bases">`;
    for(let j = sp; j < Math.min(sp+per, seq.length); j++){
      const c = bg(j), cls = "b" + (inSel(j) ? " sel" : "");
      const st = (c && !inSel(j)) ? ` style="background:${c}"` : "";
      h += `<span class="${cls}"${st} onclick="setBase(${j},event)" onmouseover="setHover(${j})">${seq[j]}</span>`;
      if((j+1) % 10 === 0) h += " ";
    }
    h += `</span></div>`;
  }
  return h;
}
function polar(cx, cy, r, deg){ const a = (deg - 90) * Math.PI / 180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
function arcPath(cx, cy, r, d0, d1){
  const [x0,y0] = polar(cx,cy,r,d0), [x1,y1] = polar(cx,cy,r,d1);
  const large = (((d1-d0) % 360 + 360) % 360) > 180 ? 1 : 0;
  return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function niceStep(L){
  const raw = L/10, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw/mag;
  const s = n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10;
  return Math.max(1, s*mag);
}
function renderCircular(seq, p){
  const L = seq.length, cx = 230, cy = 230, R = 158;
  let ticks = ""; const step = niceStep(L);
  for(let pos = 0; pos < L; pos += step){
    const deg = pos/L*360;
    const [x1,y1] = polar(cx,cy,R,deg), [x2,y2] = polar(cx,cy,R+6,deg), [tx,ty] = polar(cx,cy,R+16,deg);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#b8c4d4"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" font-size="8.5" fill="#8595a8" text-anchor="middle" dominant-baseline="middle">${pos+1}</text>`;
  }
  // features on up to three concentric lanes so overlapping ones stay readable
  const anns = (p.ann || []).slice().sort((a,b) => a.start - b.start);
  const lanes = [];
  const laneOf = a => {
    for(let i=0;i<3;i++){
      if(!lanes[i]) lanes[i] = [];
      if(!lanes[i].some(b => a.start <= b.end && a.end >= b.start)){ lanes[i].push(a); return i; }
    }
    lanes[0].push(a); return 0;
  };
  let arcs = "", labels = "";
  anns.forEach((a, i) => {
    const lane = laneOf(a), r = R - lane*11;
    const d0 = a.start/L*360, d1 = (a.end+1)/L*360;
    arcs += `<path d="${arcPath(cx,cy,r,d0,d1)}" stroke="${a.color}" stroke-width="8" fill="none" stroke-linecap="butt"
      opacity="0.95"><title>${esc(a.label)} (${a.start+1}-${a.end+1})</title></path>`;
    if((a.end - a.start) / L > 0.012 || anns.length <= 14){
      const mid = (d0 + d1)/2;
      const ring = 34 + (i % 3)*13;
      const [mx,my] = polar(cx,cy,R+ring,mid);
      const [lx,ly] = polar(cx,cy,R+8,mid);
      const anchor = (mid > 180) ? "end" : "start";
      const [ax,ay] = polar(cx,cy,R+ring-3,mid);
      labels += `<line x1="${lx.toFixed(1)}" y1="${ly.toFixed(1)}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="#cbd5e1"/>
        <text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" font-size="9.5" fill="#37475b" text-anchor="${mid>180?'end':'start'}"
          dominant-baseline="middle">${esc(a.label.length > 22 ? a.label.slice(0,21)+"…" : a.label)}</text>`;
    }
  });
  let selArc = "";
  if(sel.start !== null && sel.end !== null)
    selArc = `<path d="${arcPath(cx,cy,R+4,sel.start/L*360,(sel.end+1)/L*360)}" stroke="#f2b705" stroke-width="12" fill="none" opacity="0.55" stroke-linecap="round"/>`;
  else if(sel.start !== null){
    const [px,py] = polar(cx,cy,R+4,sel.start/L*360);
    selArc = `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="#f2b705"/>`;
  }
  return `<svg id="circ" width="100%" height="470" viewBox="0 0 460 460" style="max-width:470px;cursor:crosshair"
      onclick="circleClick(event)" onmousemove="circleHover(event)" onmouseleave="clearHover()">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#ccd6e2" stroke-width="5"/>
    ${ticks}${arcs}
    <path id="prevArc" d="" stroke="#f2b705" stroke-width="11" fill="none" opacity="0.3" stroke-linecap="round"/>
    ${selArc}${labels}
    <polygon points="${cx-6},${(cy-R-11).toFixed(1)} ${cx+6},${(cy-R-11).toFixed(1)} ${cx},${(cy-R-1).toFixed(1)}" fill="#2f6fed"/>
    <text x="${cx}" y="${cy-8}" font-size="14" fill="#16202b" text-anchor="middle" font-weight="650">${esc(p.name)}</text>
    <text x="${cx}" y="${cy+12}" font-size="11" fill="#66788c" text-anchor="middle">${L} bp · GC ${gcPct(seq).toFixed(1)}%</text>
    <text x="${cx}" y="${cy+30}" font-size="9" fill="#9aa7b5" text-anchor="middle">▲ position 1 · clockwise</text></svg>`;
}
function circleXY(e){
  const svg = document.getElementById("circ"); if(!svg) return null;
  const rect = svg.getBoundingClientRect();
  const x = (e.clientX - rect.left)/rect.width*460 - 230;
  const y = (e.clientY - rect.top)/rect.height*460 - 230;
  return { x, y };
}
function circleIdx(e, L){
  const c = circleXY(e); if(!c) return 0;
  let deg = (Math.atan2(c.y, c.x)*180/Math.PI + 90 + 360) % 360;
  let idx = Math.round(deg/360*L) % L;
  if(idx < 0) idx += L; if(idx >= L) idx = L - 1;
  return idx;
}
function circleClick(e){ const p = curP(); if(!p) return; setBase(circleIdx(e, seqOf(p).length), e); }
function circleHover(e){ const p = curP(); if(!p) return; setHover(circleIdx(e, seqOf(p).length)); }

/* ===================== selection ===================== */
function clearSel(){ sel = { start:null, end:null }; showMenu = false; copySub = false; hoverIdx = null; }
function setBase(i, e){
  hoverIdx = null;
  if(sel.start === null || (sel.start !== null && sel.end !== null)){
    sel = { start:i, end:null }; showMenu = false; copySub = false; showSidebar = false; showDetails = false;
  } else {
    if(i >= sel.start) sel.end = i; else sel = { start:i, end:sel.start };
    menuPos = e ? { x:e.clientX, y:e.clientY } : { x:260, y:260 };
    showMenu = true;
  }
  render();
}
function selecting(){ return sel.start !== null && sel.end === null; }
function setHover(i){ if(!selecting()) return; hoverIdx = i; paintPreview(); }
function clearHover(){ hoverIdx = null; paintPreview(); }
function paintPreview(){
  const p = curP(); if(!p) return; const L = seqOf(p).length;
  if(viewMode === "circular" && p.type === "dna"){
    const el = document.getElementById("prevArc"); if(!el) return;
    if(!selecting() || hoverIdx === null){ el.setAttribute("d",""); return; }
    const a = Math.min(sel.start, hoverIdx), b = Math.max(sel.start, hoverIdx);
    el.setAttribute("d", arcPath(230,230,162, a/L*360, (b+1)/L*360));
  } else {
    const wrap = document.getElementById("seqwrap"); if(!wrap) return;
    const spans = wrap.querySelectorAll(".b");
    let a = -1, b = -1;
    if(selecting() && hoverIdx !== null){ a = Math.min(sel.start, hoverIdx); b = Math.max(sel.start, hoverIdx); }
    spans.forEach((s, idx) => { if(idx >= a && idx <= b && idx !== sel.start) s.classList.add("prev"); else s.classList.remove("prev"); });
  }
}

function detailAlign(p){
  let res = "";
  if(alnResult && alnResult.error){
    res = `<div class="note warn">${esc(alnResult.error)}</div>`;
  } else if(alnResult){
    res = alignmentReport(p, alnResult);
  }
  return `<div class="panel">
    <h2>Align a read against ${esc(p.name)}</h2>
    <p class="muted" style="margin:0 0 4px">Paste a Sanger read, a nanopore consensus, a primer, or any fragment.
      Both strands are checked, the circular junction is handled, and every difference is listed in construct
      coordinates with the component it lands in.</p>
    <label>Query sequence (FASTA header is ignored)</label>
    <textarea id="aln-q" rows="5" placeholder="paste read here…">${esc(alnQuery)}</textarea>
    <div style="margin-top:12px">
      <button class="primary" onclick="doAlign()">Align</button>
      <button class="ghost" style="margin-left:8px" onclick="alnResult=null;alnQuery='';render()">Clear</button>
    </div>
    ${res}
  </div>`;
}
function doAlign(){
  const p = curP();
  let q = val("aln-q");
  alnQuery = q;
  q = q.split(/\r?\n/).filter(l => !l.startsWith(">")).join("");
  const t0 = performance.now();
  alnResult = alignToPlasmid(p, q);
  if(alnResult) alnResult.ms = Math.round(performance.now() - t0);
  render();
}
function alignmentReport(p, r){
  const seq = seqOf(p);
  const pos = i => ((i % r.refLen) + r.refLen) % r.refLen + 1;
  const diffRows = r.diffs.length ? r.diffs.map(d => {
    const hits = annotationsAt(p, d.pos);
    const label = d.type === "substitution" ? `${d.ref}→${d.qry}`
      : d.type === "deletion" ? `${d.ref} missing from read` : `${d.qry} extra in read`;
    let cons = "";
    if(hits.length){
      const a = hits[0];
      if(a.kind === "orf" || /ORF|CDS/i.test(a.label)){
        const off = d.pos - a.start, codon = Math.floor(off/3) + 1;
        cons = ` · codon ${codon} of “${esc(a.label)}”`;
      } else cons = ` · inside “${esc(a.label)}”`;
    }
    return `<tr><td><b>${pos(d.pos)}</b></td><td>${d.type}</td><td class="mono">${label}</td>
      <td class="muted">${hits.map(h => `<span class="pill grey">${esc(h.label)}</span>`).join(" ")}${cons}</td></tr>`;
  }).join("") : "";
  // blocked alignment view
  const per = 60; let blocks = "";
  for(let i=0; i<r.alnRef.length; i += per){
    const rr = r.alnRef.slice(i, i+per), qq = r.alnQry.slice(i, i+per);
    let refConsumed = 0;
    for(let j=0;j<i;j++) if(r.alnRef[j] !== "-") refConsumed++;
    const startPos = pos(r.refStart + refConsumed);
    let refHTML = "", qryHTML = "", midHTML = "";
    for(let j=0;j<rr.length;j++){
      const a = rr[j], b = qq[j];
      if(a === b){ refHTML += a; qryHTML += b; midHTML += "|"; }
      else if(a === "-" || b === "-"){ refHTML += `<span class="gp">${a}</span>`; qryHTML += `<span class="gp">${b}</span>`; midHTML += " "; }
      else { refHTML += `<span class="mm">${a}</span>`; qryHTML += `<span class="mm">${b}</span>`; midHTML += " "; }
    }
    blocks += `<div><span class="aln-lbl">${startPos}</span>${refHTML}\n<span class="aln-lbl"></span>${midHTML}\n<span class="aln-lbl">read</span>${qryHTML}\n\n</div>`;
  }
  const clean = r.diffs.length === 0;
  return `<div style="margin-top:18px">
    <div class="${clean ? "note ok" : "note"}">
      ${clean ? "✓ Perfect match" : r.diffs.length + " difference" + (r.diffs.length===1?"":"s") + " found"} —
      read aligns to <b>${pos(r.refStart)}–${pos(r.refEnd)}</b> on the
      <b>${r.strand === "+" ? "forward" : "reverse"}</b> strand,
      ${r.identity.toFixed(2)}% identity over ${r.aligned} bp${r.wraps ? ", crossing the origin" : ""}.
      <span class="muted small">(${r.ms} ms)</span>
    </div>
    ${r.diffs.length ? `<div class="panel tight" style="margin-top:12px"><h3>Differences</h3><div class="scrollx">
      <table><thead><tr><th>Position</th><th>Type</th><th>Change</th><th>Context</th></tr></thead>
      <tbody>${diffRows}</tbody></table></div>
      <div class="muted small" style="margin-top:8px">Read positions are given in construct coordinates.
        Sanger reads are unreliable in the first ~30 bases — check those against the trace before believing them.</div>
      </div>` : ""}
    <h3 style="margin-top:14px">Alignment</h3>
    <div class="alnblock">${blocks}</div>
  </div>`;
}

    <td><div class="bar" style="width:${Math.max(4, Math.min(100, Math.log10(f.size)/Math.log10(seq.length)*100))}%"><i style="width:100%"></i></div></td>
    <td class="muted mono">${f.from !== undefined ? (f.from+1) + "–" + (f.to) : ""}</td></tr>`).join("") : "";
  return `<div class="grid2">
    <div class="panel">
      <h2>Restriction map</h2>
      <p class="muted" style="margin:0 0 8px">${allNames.length} enzymes cut this construct;
        <b>${uniq.length}</b> cut exactly once. Tick up to three to simulate a digest.
        ${isSimple() ? `Showing unique cutters only &mdash;
          <a href="#" onclick="setDepth('full');return false">show all ${allNames.length}</a>.` : ""}</p>
      <div class="scrollx" style="max-height:460px;overflow-y:auto">
        <table><thead><tr><th>Enzyme</th><th>Site</th><th>Cuts</th><th>Cut at</th><th>Ends</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    <div>
      <div class="panel">
        <h2>Simulated digest</h2>
        ${digestPick.length ? `<div class="muted" style="margin-bottom:6px">${digestPick.join(" + ")} on
          ${circ ? "circular" : "linear"} ${bp(seq.length)}</div>
          <table><thead><tr><th>Fragment</th><th>Relative size</th><th>Span</th></tr></thead><tbody>${gelRows}</tbody></table>
          ${digestPick.some(n => ENZ[n].dam) ? `<div class="note">One of these is blocked by Dam methylation in a
            standard dam⁺ strain — grow the plasmid in a dam⁻ strain (e.g. JM110) or pick a different enzyme.</div>` : ""}`
          : `<div class="empty"><div class="big">🧫</div>Tick enzymes on the left to see the fragments you would run on a gel.</div>`}
      </div>
      <div class="panel">
        <h2>Composition</h2>
        <span class="stat">Length <b>${seq.length} bp</b></span>
        <span class="stat">GC <b>${gcPct(seq).toFixed(1)}%</b></span>
        <span class="stat">Tm(whole) <b>${tmQuick(seq)}°C</b></span>

/* ==== 67-shelf.js ==== */
/* =========================================================================
   THE SHARED SHELF
   Enzymes, oligos and competent cells belong to the lab, not to one person.
   There is no server here, so this does the part that works without one:
   export the reagent layer on its own, and import someone else's by MERGING
   it into yours instead of overwriting. One person can keep the master shelf
   and everyone else stays in sync by re-importing.

   Merge rules, which are also stated in the UI so nobody is surprised:
     enzymes  - keyed by name
     oligos   - keyed by sequence (an oligo is its sequence)
     cells    - keyed by strain + date made
   Where both sides have the same key, the record with the newer `updated`
   timestamp wins. Nothing is ever deleted by an import.
   ========================================================================= */

function stampReagent(r){ r.updated = new Date().toISOString(); if(!r.owner) r.owner = state.lab.me || ""; return r; }
function oligoKey(o){ return cleanDNA(o.seq || ""); }
function cellKey(c){ return (c.strain || "") + "|" + (c.date || ""); }
/* Strictly newer, compared on the timestamp itself. Object identity is not safe
   here: after one merge the local record can BE the imported object. */
function remoteNewer(mine, theirs){ return (theirs.updated || "") > (mine.updated || ""); }

function shelfSnapshot(){
  return {
    kind: "betterbench-shelf",
    v: 1,
    lab: state.lab.labName || "",
    from: state.lab.me || "",
    exported: new Date().toISOString(),
    enzymes: state.reagents.enzymes,
    oligos: state.reagents.oligos,
    cells: state.reagents.cells
  };
}
function exportShelf(){
  const snap = shelfSnapshot();
  const n = Object.keys(snap.enzymes).length + snap.oligos.length + snap.cells.length;
  if(!n){ alert("Nothing on the shelf to share yet."); return; }
  download("shelf-" + (snap.lab || "lab").replace(/[^A-Za-z0-9_.-]/g,"_") + "-" + today() + ".json",
           JSON.stringify(snap, null, 2), "application/json");
  toast("Shelf exported - " + n + " items");
}
/* Returns what a merge would do, without doing it. */
function planShelfMerge(snap){
  const plan = { added:[], updated:[], kept:[], from: snap.from || "someone", lab: snap.lab || "" };
  Object.keys(snap.enzymes || {}).forEach(name => {
    const mine = state.reagents.enzymes[name], theirs = snap.enzymes[name];
    if(!mine) plan.added.push("enzyme " + name);
    else if(remoteNewer(mine, theirs)) plan.updated.push("enzyme " + name);
    else plan.kept.push("enzyme " + name);
  });
  const mineOligo = {}; state.reagents.oligos.forEach(o => mineOligo[oligoKey(o)] = o);
  (snap.oligos || []).forEach(o => {
    const k = oligoKey(o); if(!k) return;
    if(!mineOligo[k]) plan.added.push("oligo " + (o.name || k.slice(0,12)));
    else if(remoteNewer(mineOligo[k], o)) plan.updated.push("oligo " + (o.name || k.slice(0,12)));
    else plan.kept.push("oligo " + (o.name || k.slice(0,12)));
  });
  const mineCell = {}; state.reagents.cells.forEach(c => mineCell[cellKey(c)] = c);
  (snap.cells || []).forEach(c => {
    const k = cellKey(c);
    if(!mineCell[k]) plan.added.push("cells " + c.strain);
    else if(remoteNewer(mineCell[k], c)) plan.updated.push("cells " + c.strain);
    else plan.kept.push("cells " + c.strain);
  });
  return plan;
}
function applyShelfMerge(snap){
  let added = 0, updated = 0;
  Object.keys(snap.enzymes || {}).forEach(name => {
    const mine = state.reagents.enzymes[name], theirs = snap.enzymes[name];
    if(!mine){ state.reagents.enzymes[name] = Object.assign({}, theirs); added++; }
    else if(remoteNewer(mine, theirs)){ state.reagents.enzymes[name] = Object.assign({}, theirs); updated++; }
  });
  const byKey = {}; state.reagents.oligos.forEach(o => byKey[oligoKey(o)] = o);
  (snap.oligos || []).forEach(o => {
    const k = oligoKey(o); if(!k) return;
    const mine = byKey[k];
    if(!mine){ state.reagents.oligos.push(Object.assign({}, o, { id: o.id || uid() })); added++; }
    else if(remoteNewer(mine, o)){ Object.assign(mine, o, { id: mine.id }); updated++; }
  });
  const cKey = {}; state.reagents.cells.forEach(c => cKey[cellKey(c)] = c);
  (snap.cells || []).forEach(c => {
    const mine = cKey[cellKey(c)];
    if(!mine){ state.reagents.cells.push(Object.assign({}, c, { id: c.id || uid() })); added++; }
    else if(remoteNewer(mine, c)){ Object.assign(mine, c, { id: mine.id }); updated++; }
  });
  state.lab.lastMerge = { from: snap.from || "", lab: snap.lab || "", at: new Date().toISOString(), added, updated };
  save();
  return { added, updated };
}
function importShelfFile(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const snap = JSON.parse(r.result);
      if(snap.kind !== "betterbench-shelf") throw new Error("That is not a shelf file. Use Import in the header for a whole workspace.");
      shelfPending = snap;
      render();
    } catch(e){ alert("Could not read that file: " + e.message); }
  };
  r.readAsText(f); input.value = "";
}

function runGuides(){
  const p = state.plasmids.find(x => x.id === crisprState.plasmidId); if(!p) return;
  const seq = seqOf(p), L = seq.length;
  let a = parseInt(val("cr-from"),10), b = parseInt(val("cr-to"),10);
  if(!isNaN(a) && !isNaN(b)){ crisprState.from = Math.max(0, a-1); crisprState.to = Math.min(L-1, b-1); }
  else { crisprState.from = null; crisprState.to = null; }
  const g = findGuides(seq, crisprState.sys,
    crisprState.from === null ? undefined : crisprState.from,
    crisprState.to === null ? undefined : crisprState.to);
  const top = g.slice(0, 40);
  top.forEach(x => {
    // drop the guide's own on-target hit so only genuine off-targets are reported
    let dropped = false;
    x.off = localOffTargets(x.spacer, crisprState.sys).filter(o => {
      if(!dropped && o.mm === 0 && o.plasmidId === p.id){ dropped = true; return false; }
      return true;
    });
  });
  crisprState.guides = top; crisprState.all = g.length; crisprState.selected = top[0] || null;
  render();
}

function saveProtein(aa){
  const name = prompt("Name", "protein_" + (state.plasmids.length+1)); if(!name) return;
  state.plasmids.push({ id:uid(), name, type:"protein", topology:"linear", uniprot:"", seq:aa, ann:[], stock:[],

async function loadStructure(){
  const q = val("uni-q").trim();
  const status = document.getElementById("struct-status");
  if(!q){ status.textContent = "Enter a UniProt accession or a protein name."; return; }
  if(typeof $3Dmol === "undefined"){ status.textContent = "The 3D viewer library did not load (needs internet)."; return; }
  try{
    let acc = q;
    const looksAcc = /^[A-Za-z0-9]{6,10}$/.test(q) && /[0-9]/.test(q) && !/\s/.test(q);
    if(!looksAcc){
      status.textContent = 'Resolving "' + q + '" via UniProt…';
      const r = await fetch(`https://rest.uniprot.org/uniprotkb/search?query=${encodeURIComponent(q)}&format=json&size=1&fields=accession`);
      const j = await r.json();
      if(!j.results || !j.results.length) throw new Error('No UniProt match for "' + q + '"');
      acc = j.results[0].primaryAccession;
    }
    status.textContent = "Fetching AlphaFold model for " + acc + "…";
    const ar = await fetch(`https://alphafold.ebi.ac.uk/api/prediction/${encodeURIComponent(acc)}`);
    if(!ar.ok) throw new Error("AlphaFold has no model for " + acc);
    const aj = await ar.json();
    if(!aj.length) throw new Error("No AlphaFold entry for " + acc);
    const url = aj[0].pdbUrl || aj[0].cifUrl, fmt = url.endsWith(".cif") ? "cif" : "pdb";
    const data = await (await fetch(url)).text();
    showStructure(data, fmt);
    const p = state.plasmids.find(x => x.id === (proteinState.sel && proteinState.sel.plasmidId));
    if(p){ p.uniprot = acc; save(); }
    status.innerHTML = 'AlphaFold model <b>' + acc + '</b> · coloured by pLDDT · ' +
      '<a href="https://alphafold.ebi.ac.uk/entry/' + acc + '" target="_blank" rel="noopener">open in AlphaFold DB ▸</a>';
  }catch(e){ status.textContent = "Error: " + e.message + "  (a 'failed to fetch' here usually means the page needs to be served over http)"; }
}
function showStructure(data, fmt, byConfidence){
  const el = document.getElementById("viewer3d"); if(!el) return;
  el.innerHTML = "";
  if(typeof $3Dmol === "undefined"){ el.innerHTML = '<div class="empty">3D viewer library did not load.</div>'; return; }
  const v = $3Dmol.createViewer(el, { backgroundColor:"white" });
  v.addModel(data, fmt);
  if(byConfidence){
    // a predicted model stores pLDDT in the B-factor column, so colour by confidence
    v.setStyle({}, { cartoon:{ colorfunc: atom => {
      const b = atom.b;
      return b > 90 ? "#0053D6" : b > 70 ? "#65CBF3" : b > 50 ? "#FFDB13" : "#FF7D45";
    } } });
  } else {
    // an experimental structure has real B-factors; colouring by them would be misleading
    v.setStyle({}, { cartoon:{ colorscheme:"spectrum" } });
  }
  v.zoomTo(); v.render();
}
async function foldWithESM(aa){
  const status = document.getElementById("struct-status");
  if(!aa){ status.textContent = "Pick an ORF first."; return; }
  if(aa.length > 400){ status.textContent = "ESMFold's public endpoint refuses anything over 400 residues (it answers 413). Trim to a domain and fold that."; return; }
  status.textContent = "Sending " + aa.length + " residues to ESMFold… (this can take 30-60 s and often fails)";
  try{
    const r = await fetch("https://api.esmatlas.com/foldSequence/v1/pdb/", { method:"POST", body: aa });
    if(!r.ok) throw new Error("ESMFold returned " + r.status);
    const pdb = await r.text();
    if(!/^ATOM|^HEADER|^MODEL/m.test(pdb)) throw new Error("unexpected response");
    showStructure(pdb, "pdb");
    status.innerHTML = "ESMFold prediction shown. <b>This is a prediction, not a deposited structure</b> — " +
      "the B-factor column holds pLDDT, so orange regions are low confidence.";
  }catch(e){
    status.textContent = "ESMFold failed: " + e.message + ". The public endpoint is rate-limited and refuses " +
      "file:// origins; serve the folder over http, or use the ESM Metagenomic Atlas or a local ColabFold.";
  }
}

/* ==== 72-structure.js ==== */
/* =========================================================================
   STRUCTURE LADDER
   Evidence first, prediction last:
     1. an experimental structure of this exact protein
     2. a curated predicted model (AlphaFold) of this exact protein
     3. an experimental structure of a close relative, as a stand-in
     4. only then, fold it de novo
   All four steps hit public APIs from the browser, so all four need network.
   ========================================================================= */

const RCSB_SEARCH = "https://search.rcsb.org/rcsbsearch/v2/query";

function rcsbBody(seq, identity, content, rows){
  return JSON.stringify({
    query: { type:"terminal", service:"sequence",
      parameters:{ evalue_cutoff:0.1, identity_cutoff:identity, sequence_type:"protein", value:seq } },
    request_options: { paginate:{ start:0, rows: rows || 10 },
      results_content_type: content, results_verbosity:"verbose" },
    return_type:"polymer_entity"
  });
}
/* RCSB answers 204 No Content when nothing matches, so this never assumes JSON */
async function rcsbSequenceSearch(seq, identity, content, rows){
  const r = await fetch(RCSB_SEARCH, { method:"POST",
    headers:{ "Content-Type":"application/json" }, body: rcsbBody(seq, identity, content, rows) });
  if(r.status === 204) return [];
  if(!r.ok) throw new Error("RCSB search returned " + r.status);
  const j = await r.json();
  return (j.result_set || []).map(h => {
    let mc = {};
    try { mc = h.services[0].nodes[0].match_context[0] || {}; } catch(e){}
    const qlen = mc.query_length || seq.length;
    return {
      id: h.identifier,
      identity: mc.sequence_identity != null ? mc.sequence_identity : null,
      coverage: mc.alignment_length ? Math.min(1, mc.alignment_length / qlen) : null,
      evalue: mc.evalue, mismatches: mc.mismatches, gaps: mc.gaps_opened,
      alignedLen: mc.alignment_length
    };
  });
}
/* one entry's title / method / resolution, and which protein it is */
async function rcsbEntryInfo(entityId){
  const parts = String(entityId).split("_");
  const out = { entry: parts[0], ent: parts[1] || "1" };
  try {
    const r = await fetch("https://data.rcsb.org/rest/v1/core/entry/" + out.entry);
    if(r.ok){
      const j = await r.json();
      out.title = (j.struct || {}).title;
      out.method = ((j.exptl || [])[0] || {}).method;
      const res = (j.rcsb_entry_info || {}).resolution_combined;
      out.resolution = res && res.length ? res[0] : null;
    }
  } catch(e){}
  try {
    const r = await fetch("https://data.rcsb.org/rest/v1/core/polymer_entity/" + out.entry + "/" + out.ent);
    if(r.ok){
      const j = await r.json();
      out.name = (j.rcsb_polymer_entity || {}).pdbx_description;
      out.uniprot = ((j.rcsb_polymer_entity_container_identifiers || {}).uniprot_ids || [])[0];
      out.organism = (((j.rcsb_entity_source_organism || [])[0]) || {}).ncbi_scientific_name;
    }
  } catch(e){}
  return out;
}
/* AlphaFold entries come back as AF_AF<accession>F<fragment>_<entity> */
function afAccession(id){ const m = String(id).match(/AF_AF([A-Z0-9]+)F\d+/i); return m ? m[1] : null; }

async function runStructureSearch(aa){
  aa = cleanAA(aa || "").replace(/\*/g, "");
  proteinState.search = { running:true, aa, steps:[], results:[], error:null, picked:null };
  render();
  const step = (t, s) => { proteinState.search.steps.push({ t, s }); render(); };
  try {
    if(aa.length < 25) throw new Error("Sequence is only " + aa.length +
      " residues. The structure search needs at least 25 to mean anything.");

    const results = [];
    step("Searching the PDB for this exact sequence", "run");
    const pair = await Promise.all([
      rcsbSequenceSearch(aa, 0.95, ["experimental"], 10).catch(e => ({ err:e.message })),
      rcsbSequenceSearch(aa, 0.95, ["computational"], 4).catch(() => [])
    ]);
    proteinState.search.steps.pop();
    const exact = pair[0], computed = pair[1];
    if(exact && exact.err){
      step("PDB search failed: " + exact.err, "bad");
    } else {
      step(exact.length ? exact.length + " experimental structure" + (exact.length===1?"":"s") + " at 95% identity or better"
                        : "No experimental structure at 95% identity or better", exact.length ? "good" : "none");
      for(const h of exact.slice(0, 6)){
        const info = await rcsbEntryInfo(h.id);
        results.push(Object.assign({ kind:"experimental" }, h, info));
      }
    }
    step(computed.length ? computed.length + " curated model for the same sequence"
                         : "No curated model for this sequence", computed.length ? "good" : "none");
    for(const h of computed.slice(0, 3)){
      const acc = afAccession(h.id);
      results.push(Object.assign({ kind:"predicted", accession:acc,
        title:"AlphaFold model" + (acc ? " " + acc : "") }, h));
    }
    if(!results.length){
      step("Looking for a close relative to stand in", "run");
      const homo = await rcsbSequenceSearch(aa, 0.3, ["experimental"], 8).catch(() => []);
      proteinState.search.steps.pop();
      step(homo.length ? homo.length + " related structure" + (homo.length===1?"":"s") + " between 30% and 95% identity"
                       : "No related structure above 30% identity", homo.length ? "warn" : "none");
      for(const h of homo.slice(0, 5)){
        const info = await rcsbEntryInfo(h.id);
        results.push(Object.assign({ kind:"homolog" }, h, info));
      }
    }
    // rank by evidence class first, then by how much of your sequence is actually covered
    const rank = r => (r.kind === "experimental" ? 2 : r.kind === "predicted" ? 1 : 0) * 10
                    + (r.identity || 0) * (r.coverage || 0) * 5;
    results.sort((a,b) => rank(b) - rank(a));
    proteinState.search.results = results;
    proteinState.search.running = false;
    if(!results.length)
      step("Nothing in the PDB resembles this, so a de novo prediction is what is left", "warn");
    render();
    if(results.length) showCandidate(0);
  } catch(e){
    proteinState.search.running = false;
    proteinState.search.error = e.message;
    render();
  }
}
async function showCandidate(i){
  const S = proteinState.search; if(!S) return;
  const c = (S.results || [])[i]; if(!c) return;
  S.picked = i;
  // render first: a re-render replaces #viewer3d, which would throw the model away
  render();
  const say = h => { const el = document.getElementById("struct-status"); if(el) el.innerHTML = h; };
  try {
    if(c.kind === "predicted"){
      say("Fetching the AlphaFold model for " + esc(c.accession) + "…");
      const r = await fetch("https://alphafold.ebi.ac.uk/api/prediction/" + encodeURIComponent(c.accession));
      if(!r.ok) throw new Error("AlphaFold has no model for " + c.accession);
      const j = await r.json();
      const url = (j[0] || {}).pdbUrl || (j[0] || {}).cifUrl;
      const data = await (await fetch(url)).text();
      showStructure(data, url.endsWith(".cif") ? "cif" : "pdb", true);
      say("AlphaFold model <b>" + esc(c.accession) + "</b>, coloured by pLDDT &middot; " +
        '<a href="https://alphafold.ebi.ac.uk/entry/' + encodeURIComponent(c.accession) +
        '" target="_blank" rel="noopener">AlphaFold DB &#9656;</a>');
    } else {
      say("Fetching " + esc(c.entry) + " from the PDB…");
      const r = await fetch("https://files.rcsb.org/download/" + c.entry + ".pdb");
      if(!r.ok) throw new Error("Could not download " + c.entry);
      showStructure(await r.text(), "pdb", false);
      say("<b>" + esc(c.entry) + "</b> &middot; " + esc(c.method || "experimental") +
        (c.resolution ? " at " + c.resolution + " Å" : "") +
        (c.identity != null ? " &middot; " + Math.round(c.identity*100) + "% identical to your sequence" : "") +
        ' &middot; <a href="https://www.rcsb.org/structure/' + esc(c.entry) +
        '" target="_blank" rel="noopener">RCSB &#9656;</a>');
    }
  } catch(e){ say("Could not load that structure: " + esc(e.message)); }
}
function structureLadder(aa){
  const S = proteinState.search;
  if(!S) return "";
  const icon = s => s === "good" ? '<span class="pill green">found</span>'
    : s === "warn" ? '<span class="pill amber">partial</span>'
    : s === "bad" ? '<span class="pill red">failed</span>'
    : s === "run" ? '<span class="pill blue">…</span>' : '<span class="pill grey">none</span>';
  const rows = (S.results || []).map((c,i) => {
    const pick = i === S.picked;
    const badge = c.kind === "experimental" ? '<span class="pill green">experimental</span>'
      : c.kind === "predicted" ? '<span class="pill blue">predicted</span>'
      : '<span class="pill amber">relative</span>';
    return `<div class="candrow ${pick?"on":""}" onclick="showCandidate(${i})" tabindex="0"
        onkeydown="if(event.key==='Enter')showCandidate(${i})">
      <div style="flex:1;min-width:0">
        <div><b>${esc(c.entry || c.accession || c.id)}</b> ${badge}
          ${c.identity != null ? `<span class="muted small">${Math.round(c.identity*100)}% identity${
            c.coverage != null ? ", covering " + Math.round(c.coverage*100) + "% of your sequence" : ""}</span>` : ""}</div>
        <div class="muted small candsub">${esc(c.name || c.title || "")}${c.organism ? " · " + esc(c.organism) : ""}${
          c.method ? " · " + esc(c.method) + (c.resolution ? " " + c.resolution + " Å" : "") : ""}</div>
      </div>
      <button class="ghost">${pick ? "shown" : "show"}</button>
    </div>`;
  }).join("");
  const nothing = !S.running && !(S.results||[]).length && !S.error;
  return `<div class="panel">
    <div class="lblrow"><h2 style="margin:0">Structure search</h2>
      ${S.running ? '<span class="muted small">searching…</span>'
        : '<button class="ghost" onclick="proteinState.search=null;render()">Clear</button>'}</div>
    <div class="ladder">
      ${(S.steps||[]).map(s => `<div class="lrow">${icon(s.s)}<span>${esc(s.t)}</span></div>`).join("")}
    </div>
    ${S.error ? `<div class="note warn">${esc(S.error)}</div>` : ""}
    ${rows ? `<div style="margin-top:10px">${rows}</div>` : ""}
    ${(S.results||[]).some(c => c.kind === "homolog") ? `<div class="note" style="margin-top:10px">
      These are <b>relatives</b>, not your protein. The fold is usually right; loops, side chains and anything
      near a mutation are not. Check the identity and coverage before you reason from one.</div>` : ""}
    ${nothing ? `<div class="note" style="margin-top:10px">
      Nothing in the PDB matches. Folding it from scratch is what is left — useful, but a prediction.
      <div style="margin-top:8px"><button class="primary" onclick="foldWithESM(${jsq(aa)})">Predict with ESMFold</button></div>
    </div>` : ""}
  </div>`;
}

}
function sourceName(p){
  const s = p.sourceId ? state.plasmids.find(x => x.id === p.sourceId) : null;
  return s ? s.name + (p.sourceSpan ? " " + (p.sourceSpan[0]+1) + "–" + (p.sourceSpan[1]+1) : "") : "pasted";
}
/* Order matters here: "T7 terminator" must not be caught by the T7 promoter rule,
   so the specific words are tested before the promoter-family shorthands. */
function guessKind(label){
  const l = label.toLowerCase();
  if(/terminat|poly ?a signal|polya|bgh pa|sv40 pa/.test(l)) return "terminator";
  if(/promoter|enhancer/.test(l)) return "promoter";
  if(/\btag\b|his|flag|\bha\b|\bmyc\b|strep|\bgst\b|\bmbp\b|sumo|tev|prescission|3c site/.test(l)) return "tag";
  if(/ampr|kanr|neor|\bcmr\b|puro|blastic|hygro|resistance|marker|\bbla\b|lacz/.test(l)) return "marker";
  if(/\bori\b|origin/.test(l)) return "origin";
  if(/\borf\b|\bcds\b|gfp|cherry|cas9|luciferase|\brfp\b|\byfp\b|polymerase|repressor/.test(l)) return "cds";
  if(/linker|spacer|gsgs/.test(l)) return "linker";
  if(/\brbs\b|kozak|ires|wpre|loxp|\bfrt\b|att[bplr]|operator|\b2a\b/.test(l)) return "element";
  if(/\bt7\b|\bt3\b|\bsp6\b|\bu6\b|\bcmv\b|ef1|pgk|\bh1\b/.test(l)) return "promoter";
  return "element";
}
function harvestParts(){
  let n = 0, skipped = 0;
  state.plasmids.forEach(p => {
    if(p.type !== "dna") return;
    const s = seqOf(p);
    (p.ann || []).forEach(a => {
      const seq = s.slice(a.start, a.end + 1);
      if(seq.length < 12){ skipped++; return; }
      if(/^(sgRNA|insert)\b/i.test(a.label)) return;
      if(state.parts.some(x => x.seq === seq)) { skipped++; return; }
      state.parts.push({ id:uid(), name:a.label, kind:guessKind(a.label), seq,
        sourceId:p.id, sourceSpan:[a.start, a.end], tags:p.tags.slice(), note:"" });
      n++;
    });
  });
  save(); render();
  toast(n + " part" + (n===1?"":"s") + " harvested" + (skipped ? ", " + skipped + " already known or too short" : ""));
}
function addPartManual(){
  const name = prompt("Part name"); if(!name) return;
  const seq = cleanDNA(prompt("Sequence") || "");
  if(!seq){ alert("No valid DNA."); return; }
  const kind = prompt("Kind (" + PART_KINDS.join(" / ") + ")", guessKind(name)) || "custom";
  state.parts.push({ id:uid(), name, kind: PART_KINDS.includes(kind) ? kind : "custom", seq,
                     sourceId:null, sourceSpan:null, tags:[], note:"" });
  save(); render();
}
function delPart(id){ state.parts = state.parts.filter(p => p.id !== id); save(); render(); }
/* called from the map's selection menu */
function savePartFromSelection(){
  const p = curP(); if(!p || sel.start === null || sel.end === null) return;
  const name = prompt("Part name", "part " + (sel.start+1) + "-" + (sel.end+1));
  if(!name) return;
  state.parts.push({ id:uid(), name, kind:guessKind(name), seq: seqOf(p).slice(sel.start, sel.end + 1),

  showMenu = false; save(); render(); toast("Saved to Parts");
}

function asmRouteDetail(r){

    <div class="muted small">${P.method === "goldengate"

  const primerRows = P.primers.map(x => [x.f, x.r].map(pr => `<tr>
      <td><b>${esc(pr.name)}</b></td>
      <td class="mono" style="word-break:break-all;max-width:340px"><span class="muted">${pr.tail}</span>${pr.anneal}</td>

  const oh = P.overhangs ? `<h3 style="margin-top:16px">Junction overhangs</h3>

      ${P.overhangs.map((o,i) => `<tr><td>${i === 0 ? "backbone → " + (r.pieces[1]?esc(r.pieces[1].name):"insert")
          : (r.pieces[i]?esc(r.pieces[i].name):"piece "+i) + " → " + (r.pieces[i+1]?esc(r.pieces[i+1].name):"backbone")}</td>

        <td class="muted">${o.shift ? (o.shift > 0 ? "+" : "") + o.shift + " bp" : "—"}</td></tr>`).join("")}

      bases — the product is identical either way.</div>` : "";
  const steps = asmProtocol(r);
  const missing = r.enzymesMissing.length
    ? `<div class="note warn">You do not have ${r.enzymesMissing.join(", ")} on the shelf. Buy it, or pick a
        different route.</div>` : "";

          : P.arm + " bp of homology to the neighbouring piece"}.

    ${oh}
    <h3 style="margin-top:16px">Protocol</h3>
    ${protocolList(steps)}
    <h3 style="margin-top:16px">Predicted construct — ${bp(P.product.length)}</h3>
    <div class="muted small" style="margin-bottom:6px">GC ${gcPct(P.product).toFixed(1)}% ·
      ${P.ann.length} components carried across</div>
    <div class="seqbox">${P.product.match(/.{1,60}/g).slice(0,5).join("\n")}${P.product.length > 300 ? "\n… " + (P.product.length - 300) + " more bp" : ""}</div>
    <div style="margin-top:12px">
      <button class="primary" onclick="asmSave()">Save as a construct</button>
      <button class="ghost" style="margin-left:8px" onclick="copyText(${jsq(P.product)},'Product')">Copy sequence</button>
      <button class="ghost" style="margin-left:8px" onclick="asmConsume()">Log what this used</button>
    </div>
  </div>`;
}
function asmProtocol(r){
  const P = r.plan, steps = [];
  if(r.key === "restriction"){
    const vec = state.plasmids.find(x => x.id === asm.backboneId) || r.backbonePlasmid;
    return restrictionProtocol({ vec, ins:r.sourced[0].seq, insName:r.sourced[0].name },
                               P.pair, !P.ready, P.built);
  }
  const pcrs = r.pieces.filter(p => (p.source||{}).how === "pcr");
  if(r.cut && (r.pieces[0].source||{}).how === "digest")
    steps.push("Digest 1 µg of " + r.pieces[0].name.replace("backbone", (state.plasmids.find(x=>x.id===asm.backboneId)||{}).name || "the backbone")
      + " with " + r.cut + " (single site), then gel-purify the " + bp(r.pieces[0].seq.length) + " band.");
  if(P.primers.length)
    steps.push("Amplify " + P.primers.length + " piece" + (P.primers.length>1?"s":"") +
      " with the tailed primers above, high-fidelity polymerase. DpnI-treat and column-purify each product.");
  if(r.orders.length)
    steps.push("Order " + r.orders.map(o => o.name + " (" + bp(o.seq.length) + ")").join(", ") + " as synthetic fragment" +
      (r.orders.length>1?"s":"") + "; resuspend to 10 ng/µL on arrival.");
  if(P.method === "goldengate"){
    steps.push("Set up 20 µL: 2 µL 10× T4 ligase buffer, 1 µL " + P.iis + ", 1 µL T4 DNA ligase, ~75 ng of each piece, water to 20 µL.");
    steps.push("Cycle 30× (37 °C 1 min, 16 °C 1 min), then 60 °C 5 min, then 80 °C 10 min.");
  } else {
    steps.push("Assemble 50-100 ng of backbone with a 2-3× molar excess of each insert in 20 µL of 2× HiFi master mix.");
    steps.push("50 °C for " + (r.pieces.length > 3 ? "60" : "15") + " min — " + (r.pieces.length-1) +
      " fragment" + (r.pieces.length-1===1?"":"s") + " into the backbone.");
  }
  steps.push("Transform 2 µL into chemically competent cells" +
    (state.reagents.cells.length ? " (" + state.reagents.cells[0].strain + ", " +
      (state.reagents.cells[0].vials != null ? state.reagents.cells[0].vials + " vials left" : "in stock") + ")" : "") +
    "; plate on the backbone's selection.");
  const screen = pickScreeningDigest(P.product);
  if(screen && ownsEnzyme(screen.names[0]))
    steps.push("Screen by " + screen.names.join(" + ") + " digest — a correct clone gives " +
      screen.sizes.map(bp).join(" + ") + ".");
  steps.push("Sequence across every junction. " + (P.overhangs ? "Golden Gate junctions are scarless, so the read should match the design exactly."
    : "Overlap regions are where assembly errors show up first."));
  return steps;
}

function downloadFasta(name, seq){

let mutState = { templateId:null, by:"aa", orfKey:null, spec:"", ntPos:"", ntKind:"sub", ntNew:"", ntLen:1,

/* every coding region we could number codons against: real annotations first,
   then anything the ORF finder turns up */
function mutORFs(p){
  if(!p || p.type !== "dna") return [];
  const out = [];
  (p.ann || []).forEach(a => {
    if(a.kind === "orf" || a.kind === "cds" || /\b(orf|cds)\b/i.test(a.label))
      out.push({ key:"ann:" + a.id, label:a.label, start:a.start, end:a.end, strand:a.strand || 1 });
  });
  if(!out.length)
    plausibleORFs(seqOf(p)).forEach((o, i) =>
      out.push({ key:"auto:" + i, label:"ORF " + o.len + " aa (" + (o.strand===1?"+":"−") + ")",
                 start:o.start, end:o.end, strand:o.strand }));
  return out;
}
function mutCurrentORF(p){
  const list = mutORFs(p);
  return list.find(o => o.key === mutState.orfKey) || list[0] || null;
}
function mutReset(){ mutState.result = null; mutState.error = null; }

function runMutation(){
  const p = state.plasmids.find(x => x.id === mutState.templateId);
  mutState.result = null; mutState.error = null;
  if(!p){ mutState.error = "Choose a construct first."; render(); return; }
  const seq = seqOf(p);
  let edit = null;
  if(mutState.by === "aa"){
    const orf = mutCurrentORF(p);
    if(!orf){ mutState.error = "No coding region to number against. Label an ORF, or switch to By base."; render(); return; }
    const change = parseAAChange(mutState.spec);
    if(!change){ mutState.error = 'Could not read "' + mutState.spec + '". Try something like E123K, 123K or E123del.'; render(); return; }
    edit = aaChangeToEdit(p, orf, change, mutState.host);
    if(edit.error){ mutState.error = edit.error; render(); return; }
  } else {
    const pos = parseInt(mutState.ntPos, 10);
    if(!pos || pos < 1 || pos > seq.length){ mutState.error = "Give a base position between 1 and " + seq.length + "."; render(); return; }
    const a = pos - 1;
    if(mutState.ntKind === "sub"){
      const nw = cleanDNA(mutState.ntNew);
      if(!nw){ mutState.error = "Give the replacement bases."; render(); return; }
      edit = { kind:"sub", a, b:a + nw.length - 1, newSeq:nw,
               note:"replaces " + seq.slice(a, a + nw.length) + " at " + pos + " with " + nw };
      if(edit.b >= seq.length){ mutState.error = "That substitution runs past the end of the sequence."; render(); return; }
    } else if(mutState.ntKind === "ins"){
      const nw = cleanDNA(mutState.ntNew);
      if(!nw){ mutState.error = "Give the bases to insert."; render(); return; }
      edit = { kind:"ins", a, b:a - 1, newSeq:nw, note:"inserts " + nw.length + " bp before base " + pos };
    } else {
      const n = Math.max(1, mutState.ntLen || 1);
      if(a + n > seq.length){ mutState.error = "That deletion runs past the end of the sequence."; render(); return; }
      edit = { kind:"del", a, b:a + n - 1, newSeq:"", note:"deletes " + n + " bp from base " + pos };
    }
  }
  const res = designMutagenesis(p, edit, { host:mutState.host,
    polymerase: defaultPolymerase(), targetTa: state.lab.targetTa });
  if(res.error){ mutState.error = res.error; render(); return; }
  mutState.result = res;
  render();
}

function applyScreeningSite(){
  const r = mutState.result; if(!r || !r.screening) return;
  const p = state.plasmids.find(x => x.id === mutState.templateId); if(!p) return;
  const sc = r.screening;
  // the silent change and the real mutation together, redesigned as one edit
  const seq = seqOf(p);
  const lo = Math.min(r.edit.a, r.edit.a + sc.offset * 3);
  const hi = Math.max(r.edit.b, r.edit.a + sc.offset * 3 + 2);
  let span = seq.slice(lo, hi + 1);
  // rebuild the span from the product-with-site, which already has both changes
  const shift = r.edit.newSeq.length - (r.edit.b - r.edit.a + 1);
  const newSpan = sc.seqWithSite.slice(lo, hi + 1 + shift);
  const edit = { kind:"sub", a:lo, b:hi, newSeq:newSpan, strand:r.edit.strand,
    fromAA:r.edit.fromAA, toAA:r.edit.toAA, aaPos:r.edit.aaPos, changes:r.edit.changes,
    note:(r.edit.note || "mutation") + " + silent " + sc.enzyme + " site" };
  const res = designMutagenesis(p, edit, { host:mutState.host });
  if(res.error){ toast(res.error); return; }
  res.screening = null;
  res.notes.push("Includes the silent " + sc.enzyme + " site at codon " + sc.codonPos + " for screening.");
  mutState.result = res; render();
  toast("Screening site added to the primer");
}
function saveMutant(){
  const r = mutState.result; if(!r) return;
  const p = state.plasmids.find(x => x.id === mutState.templateId); if(!p) return;
  const label = r.edit.fromAA ? r.edit.fromAA + r.edit.aaPos + (r.edit.toAA || "del") : "mut";
  const name = prompt("Name for the mutant", p.name + "-" + label);
  if(!name) return;
  const np = { id:uid(), name, type:"dna", topology:p.topology, uniprot:p.uniprot || "", seq:r.product,
    ann:r.ann, stock:[], inSilico:true, tags:(p.tags||[]).concat(["mutant"]), created:today(),
    notes:(r.edit.note || "") + (p.notes ? "\n\nFrom " + p.name + ": " + p.notes : ""),
    color:p.color || null, source:"site-directed mutagenesis in BetterBench",
    parents:[{ id:p.id, name:p.name, role:"template" }] };
  state.plasmids.push(np);
  state.builds.push({ id:uid(), date:today(), productId:np.id, vector:p.name,
    insert:r.edit.note || "point mutation", route:"mutagenesis" });
  save(); openPlasmid(np.id);
  toast("Saved — in silico until you log a tube");
}

/* The two questions everyone asks the first time they see this method. */
function howItWorksPanel(){
  return `<details class="fold" style="margin-top:14px"><summary>How this works</summary>
    <div class="howbox">
      <p>The two primers point <b>away</b> from each other, with their 5' ends touching. PCR therefore copies the
      <b>whole plasmid</b> as one long linear product, and the ends are joined afterwards.</p>

      <div class="howdiag mono">
<span class="muted">template</span>   ────────────┬──────●──────┬────────────
                    <span class="howrev">◄══ reverse</span>   <span class="howmut">▲</span>    <span class="howfwd">forward ══►</span>
                                 the change
<span class="muted">product </span>   <span class="howfwd">forward ══►</span> ·········· around the plasmid ·········· <span class="howrev">◄══ reverse</span>
                    └─ ligase joins these two ends ─┘
      </div>

      <h3 style="margin-top:14px">Why there is no overlap</h3>
      <p>The older QuikChange method used two fully overlapping primers, both carrying the mutation. Being
      complementary, they anneal to <i>each other</i> as readily as to the template, so you get primer dimer and
      only linear amplification. Back-to-back primers cannot pair with each other, so the reaction amplifies
      exponentially like a normal PCR and gives far more product.</p>

      <h3>Why only the forward primer carries the change</h3>
      <p>Because the primers do not overlap, the mutation site sits inside <b>one primer's footprint only</b> — the
      reverse primer is annealing to a different stretch of DNA entirely. There is nowhere for it to also carry the
      change. And there is no need: every copy made from the forward primer already contains it, and after ligation
      every circle does too.</p>

      <h3>Why the change sits in the middle of that primer</h3>
      <p>Two reasons. The polymerase needs about ten perfectly matched bases at the <b>3' end</b> or it will not
      extend. And a mismatch at the extreme <b>5' end</b> would land exactly on the blunt join, where it ligates
      badly and the edit can be lost. So it goes in the middle, with matching sequence either side.</p>

      <h3>How the mutation takes over</h3>
      <p>In the first cycle the forward primer copies the parent and makes a mutant strand; the reverse primer
      copies the parent and makes a wild-type one. From the second cycle on, the reverse primer has a new kind of
      template available — the strands the forward primer just made — and copying one of those copies the
      mutation with it.</p>
      <div class="howdiag mono">
<span class="muted">cycle 1</span>  parent circle  →  <span class="howfwd">F strand (mutant)</span>  +  <span class="howrev">R strand (wild type)</span>
         <span class="muted">one ragged end each — neither can be ligated</span>

<span class="muted">cycle 2</span>  <span class="howfwd">F strand</span> → R copies it → <span class="howrev">R strand (now mutant)</span>
         <span class="howrev">R strand</span> → F copies it → <span class="howfwd">F strand (mutant)</span>
         <span class="muted">both ends now defined — this is the ligatable product</span>

<span class="muted">cycle n</span>  parent-derived: <b>n</b> copies, linear growth, unligatable
         product-derived: <b>2ⁿ</b> copies, every one carrying the change
      </div>
      <p>The sharper way to see it: a molecule can only close into a circle if <b>both</b> ends are clean, and an end
      is only clean if a primer defined it. Every such molecule has the forward primer at one end — so every
      molecule that can become a plasmid carries the mutation. The wild-type strands from cycle one have a ragged
      3' end from running off the circular template and are simply never ligated.</p>
      <p>Both strands end up carrying the change, so the circle is a proper matched duplex rather than a mismatch
      the cell has to resolve — which is why colonies come back clean rather than mixed.</p>

      <h3>Insertions and deletions</h3>
      <p>An insertion is new sequence with no template to match, so it can only be a 5' tail — and if it is long it
      is split across both primers so neither becomes an ultramer. A deletion needs no mismatch at all: the primers
      simply sit either side of the region and it is never copied.</p>

      <h3>What KLD does</h3>
      <p>Three enzymes in one five-minute step. <b>Kinase</b> adds the 5' phosphates that synthetic primers lack,
      so the ends can be joined. <b>Ligase</b> closes the circle. <b>DpnI</b> cuts only methylated DNA — your
      template came out of a <i>dam+</i> E. coli strain and is methylated, while the PCR product was made in vitro
      and is not, so the parent is destroyed and the mutant survives.</p>
    </div>
  </details>`;
}

function tlMassMoles(){
  const mw = parseFloat(val("t-type")), len = parseFloat(val("t-len")), ng = parseFloat(val("t-ng"));
  const r = document.getElementById("t-mm-res"); if(!r) return;
  if(!len || isNaN(ng)){ r.textContent = ""; return; }
  const pmol = ng*1000/(len*mw);
  r.innerHTML = "= <b>" + pmol.toFixed(3) + " pmol</b> · " + (pmol*6.022e11).toExponential(2) + " molecules · "
    + (len*mw/1e6).toFixed(2) + " MDa per molecule";
}
function tlLig(){
  const vng = parseFloat(val("l-vng")), vlen = parseFloat(val("l-vlen")), ilen = parseFloat(val("l-ilen")), ratio = parseFloat(val("l-ratio"));
  const r = document.getElementById("l-res"); if(!r) return;
  if(!vng || !vlen || !ilen || !ratio){ r.textContent = ""; return; }
  const ing = ratio*(ilen/vlen)*vng;
  r.innerHTML = "Use <b>" + ing.toFixed(1) + " ng</b> of insert for a " + ratio + ":1 molar ratio<br>"
    + '<span class="muted small">' + (vng*1000/(vlen*650)).toFixed(3) + " pmol vector · "
    + (ing*1000/(ilen*650)).toFixed(3) + " pmol insert</span>";
}
function tlDil(){
  const c1 = parseFloat(val("d-c1")), c2 = parseFloat(val("d-c2")), v2 = parseFloat(val("d-v2"));
  const r = document.getElementById("d-res"); if(!r) return;
  if(!c1 || !c2 || !v2){ r.textContent = ""; return; }
  if(c2 > c1){ r.innerHTML = '<span style="color:var(--red)">Final concentration is higher than the stock.</span>'; return; }
  const v1 = c2*v2/c1;
  r.innerHTML = "Take <b>" + v1.toFixed(2) + "</b> of stock and add <b>" + (v2-v1).toFixed(2) + "</b> of diluent"
    + '<br><span class="muted small">' + (c1/c2).toFixed(1) + "-fold dilution</span>";
}
function tlTm(){
  const seq = cleanDNA(val("tm-seq")), conc = parseFloat(val("tm-conc")) || 0.25, na = parseFloat(val("tm-na")) || 50;
  const r = document.getElementById("tm-res"); if(!r) return;
  if(seq.length < 2){ r.textContent = ""; return; }
  const t = tmNN(seq, conc*1e-6, na/1000);
  r.innerHTML = "NN Tm <b>" + t + " °C</b> · Wallace/GC rule " + tmQuick(seq) + " °C<br>"
    + '<span class="muted small">' + seq.length + " nt · GC " + gcPct(seq).toFixed(0) + "% · suggested annealing "
    + (t - 3).toFixed(0) + "-" + t.toFixed(0) + " °C</span>"
    + (primerWarnings(seq).length ? '<div class="note" style="margin-top:8px">⚠ ' + primerWarnings(seq).join("; ") + "</div>" : "");
}
function tlAgarose(){
  const b = parseFloat(val("ag-bp")); const r = document.getElementById("ag-res"); if(!r) return;
  if(!b){ r.textContent = ""; return; }
  const pct = b > 8000 ? 0.5 : b > 4000 ? 0.7 : b > 1500 ? 1.0 : b > 700 ? 1.2 : b > 300 ? 1.5 : b > 100 ? 2.0 : 2.5;
  const range = b > 8000 ? "1-30 kb" : b > 4000 ? "0.8-12 kb" : b > 1500 ? "0.5-7 kb" : b > 700 ? "0.4-6 kb"
    : b > 300 ? "0.2-3 kb" : b > 100 ? "50-800 bp" : "20-500 bp";
  r.innerHTML = "Use a <b>" + pct.toFixed(1) + "%</b> gel · resolving range " + range + "<br>"
    + '<span class="muted small">50 mL gel: ' + (pct*0.5).toFixed(2) + " g agarose in 50 mL 1× TAE</span>";
}
function tlAntibiotic(){
  const stock = parseFloat(val("ab-stock")), work = parseFloat(val("ab-work")), vol = parseFloat(val("ab-vol"));
  const r = document.getElementById("ab-res"); if(!r) return;
  if(!stock || !work || !vol){ r.textContent = ""; return; }
  const ul = (work*vol)/(stock*1000)*1000;
  r.innerHTML = "Add <b>" + ul.toFixed(1) + " µL</b> of stock to " + vol + " mL of medium"
    + '<br><span class="muted small">1:' + Math.round(stock*1000/work) + " dilution — cool agar below 55 °C first</span>";
}
function tlSol(){
  const mw = parseFloat(val("s-mw")), m = parseFloat(val("s-m")), v = parseFloat(val("s-v"));
  const r = document.getElementById("s-res"); if(!r) return;
  if(!mw || !m || !v){ r.textContent = ""; return; }
  const g = mw*m*v/1000;
  r.innerHTML = "Weigh out <b>" + (g >= 1 ? g.toFixed(3) + " g" : (g*1000).toFixed(1) + " mg") + "</b> and make up to " + v + " mL";
}
function tlTE(){
  const col = parseFloat(val("te-col")), ng = parseFloat(val("te-ng")),
        plated = parseFloat(val("te-plated")), total = parseFloat(val("te-total"));
  const r = document.getElementById("te-res"); if(!r) return;
  if(!col || !ng || !plated || !total){ r.textContent = ""; return; }
  const eff = col*(total/plated)/(ng/1000);
  r.innerHTML = "<b>" + eff.toExponential(2) + " cfu/µg</b><br><span class='muted small'>"
    + (eff > 1e8 ? "high-efficiency range — fine for library work"
      : eff > 1e6 ? "normal for home-made chemically competent cells"
      : "low — check the cells, the ligation buffer's ATP, and the heat shock timing") + "</span>";
}



/* ==== 85-connect.js ==== */
/* ===================== VIEW: connect ===================== */
const SIGNAL_STAGES = ["planning","building","characterising","stuck","shelved"];
let connectTab = "matches";

function sharedParts(){
  const ids = new Set(state.plasmids.filter(p => state.connect.optIn[p.id]).map(p => p.id));
  return state.parts.filter(p => !p.sourceId || ids.has(p.sourceId));
}
function myTags(){
  const t = new Set();
  state.plasmids.filter(p => state.connect.optIn[p.id]).forEach(p => featureTags(p).forEach(x => t.add(x)));
  sharedParts().forEach(p => { t.add(p.name); (p.tags||[]).forEach(x => t.add(x)); });
  state.signals.filter(s => s.share).forEach(s => (s.tags||[]).forEach(x => t.add(x)));
  return [...t].filter(Boolean);
}

function viewConnect(){
  const c = state.connect;
  if(!c.enabled) return connectIntro();
  const tabs = [["matches","Matches"],["signals","What you're working on"],["sharing","What you share"],["crowd","Where the crowd is"]]
    .map(([k,l]) => `<button class="${connectTab===k?"on":""}" onclick="connectTab='${k}';render()">${l}</button>`).join("");
  const shared = state.plasmids.filter(p => c.optIn[p.id]);
  let body = "";
  if(connectTab === "matches")      body = connectMatches(shared);
  else if(connectTab === "signals") body = connectSignals();
  else if(connectTab === "sharing") body = connectSharing();
  else                              body = connectCrowd();
  return `<h1 class="page">Connect</h1>
  <p class="lede">Opt-in matching on what you are building right now, not on what you have published.
  ${shared.length} of ${state.plasmids.length} constructs and ${state.signals.filter(s=>s.share).length} of
  ${state.signals.length} notes are shared.</p>
  <div class="toggle" style="margin-bottom:14px">${tabs}</div>
  ${body}
  <div class="panel">
    <div class="lblrow"><h2 style="margin:0">Profile</h2>
      <button class="ghost danger" onclick="connectOff()">Turn off &amp; clear</button></div>
    <div class="grid2">
      <div><label class="plain">Name (or a pseudonym)</label>
        <input value="${esc(c.name)}" oninput="state.connect.name=this.value;save()"></div>
      <div><label class="plain">Group / institution</label>
        <input value="${esc(c.org)}" oninput="state.connect.org=this.value;save()"></div>
      <div><label class="plain">Contact — shown only after both sides accept</label>
        <input value="${esc(c.contact)}" oninput="state.connect.contact=this.value;save()"></div>
      <div><label class="plain">What you would want to hear about</label>
        <input value="${esc(c.topics)}" placeholder="anything expressing LRRC8 in HEK" oninput="state.connect.topics=this.value;save()"></div>
    </div>
  </div>`;
}
function connectOff(){
  if(!confirm("Turn Connect off and clear the profile? Your signals stay, but stop being shared.")) return;
  state.signals.forEach(s => s.share = false);
  state.connect = { enabled:false, name:"", org:"", contact:"", topics:"", shareMode:"features", optIn:{} };
  save(); render();
}
function connectIntro(){
  return `<h1 class="page">Connect</h1>
  <p class="lede">An opt-in way to find the other groups working on what you are working on — before one of you
  reads about it in a journal.</p>
  <div class="panel">
    <h2>Why this exists</h2>
    <p class="muted" style="line-height:1.65">Labs routinely discover, at publication, that another group spent two
      years on the same question. The information that would have prevented it — “we are building a tagged version of
      this gene” — is not something anyone writes a preprint about. It lives in plasmid maps and in the sentence you
      would say to a colleague at coffee.</p>
    <p class="muted" style="line-height:1.65">The other half of the idea is that the useful connection is often a
      <i>small</i> one. Not “we both study ion channels”, but “you also fought with a construct that has a 40 bp repeat
      and an ORF that is toxic in E. coli”. Those are the matches that save a month, and no platform surfaces them.</p>
    <h2 style="margin-top:18px">How matching works here</h2>
    <ul class="muted" style="line-height:1.7;padding-left:18px">
      <li><b>Feature mode (default):</b> only the <i>names</i> of your parts and annotations leave — “EGFP”,
        “U6 promoter”, “LRRC8A”. No sequence at all.</li>
      <li><b>Sketch mode:</b> adds a MinHash sketch — 128 hashed 21-mers — which supports similarity estimation
        without shipping the sequence. Be clear-eyed: a sketch is a reduction, not encryption. Someone who already
        suspects a specific sequence can test that guess against it.</li>
      <li>Sharing is <b>per construct and per note</b>. Nothing is shared until you tick it.</li>
    </ul>
    <div class="note info">This build has no server. Matching runs against a small demo registry bundled in the file,
      so you can judge the behaviour before deciding whether the idea deserves a backend.</div>
    <div style="margin-top:16px"><button class="primary" onclick="state.connect.enabled=true;save();render()">Turn on Connect</button></div>
  </div>`;
}

/* ---- matches ---- */
function connectMatches(shared){
  const tags = myTags();
  const matches = DEMO_REGISTRY.map(g => Object.assign({ g }, tagOverlap(tags, g.tags)))
    .filter(m => m.inter > 0).sort((a,b) => b.score - a.score || b.inter - a.inter);
  // the sharper signal: a group matching something you are actively working on
  const activeTags = new Set(state.signals.filter(s => s.share && s.stage !== "shelved")
    .flatMap(s => (s.tags||[]).map(t => t.toLowerCase())));
  return `<div class="panel">
    <h2>Groups working on overlapping things</h2>
    ${!shared.length && !activeTags.size
      ? `<div class="empty"><div class="big">🔗</div>Nothing shared yet — tick a construct under
          <b>What you share</b>, or post a note about what you are building.</div>`
      : matches.length ? matches.map(m => {
        const live = m.shared.filter(s => activeTags.has(s));
        return `<div class="matchrow">
          <div style="flex:1">
            <div><b>${esc(m.g.label)}</b>
              <span class="muted small"> · ${esc(m.g.field)} · ${esc(m.g.org)} · ${m.g.members} people · active ${esc(m.g.active)}</span>
              ${live.length ? `<span class="pill red">overlaps live work</span>` : ""}</div>
            <div class="muted small" style="margin-top:3px">shares ${m.inter} item${m.inter===1?"":"s"}:
              ${m.shared.map(s => `<span class="pill ${activeTags.has(s)?"red":"grey"}">${esc(s)}</span>`).join(" ")}</div>
            <div class="bar" style="margin-top:6px;max-width:240px"><i style="width:${Math.round(m.score*100)}%"></i></div>
          </div>
          <button class="ghost" onclick="requestIntro(${jsq(m.g.label)})">Request intro</button>
        </div>`;
      }).join("") : `<div class="muted">No overlap with the demo registry yet. Harvest some parts, or add tags to a note.</div>`}
    <div class="note info" style="margin-top:12px">Matches rank on shared parts, not on field. Group G overlaps with
      Group A on a single gene while working on a completely different question — that is exactly the connection the
      literature-based route misses.</div>
  </div>`;
}
