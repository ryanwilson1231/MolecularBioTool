<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetterBench</title>
<!--
  BetterBench v3 - all-in-one molecular biology workspace.
  Single file, no build step. Everything is stored in your browser (localStorage).

  Double-click to open. Three features make outbound web requests (UniProt lookup,
  AlphaFold model download, optional ESMFold prediction). If those fail with
  "failed to fetch" on a double-clicked file, serve the folder instead:
      python -m http.server
  then open http://localhost:8000/betterbench.html
-->
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<style>
  :root{
    --bg:#f4f7fb; --panel:#ffffff; --panel2:#fafbfd; --ink:#16202b; --muted:#66788c;
    --line:#e2e8f0; --line2:#eef2f7; --accent:#2f6fed; --accent-soft:#eaf1ff; --accent2:#7c5cf0;
    --red:#d4504a; --red-soft:#fdeceb; --green:#17915f; --green-soft:#e8f7f0;
    --amber:#b57d09; --amber-soft:#fdf6e3; --sel:#ffe680; --shadow:0 1px 3px rgba(20,35,60,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* ---------- chrome ---------- */
  header.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:0 18px;height:54px;
       display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:900}
  header.topbar .brand{font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
  header.topbar .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:20px}
  header.topbar .spacer{margin-left:auto}
  .shell{display:flex;align-items:flex-start;min-height:calc(100vh - 54px)}
  nav.rail{width:196px;flex:0 0 196px;padding:16px 10px;border-right:1px solid var(--line);background:var(--panel);
       position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
  nav.rail .navitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;
       color:var(--muted);font-weight:500;margin-bottom:2px;user-select:none;font-size:13px}
  nav.rail .navitem:hover{background:var(--panel2);color:var(--ink)}
  nav.rail .navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  nav.rail .navitem .ic{width:18px;text-align:center;font-size:14px}
  nav.rail .navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#9aa8b8;
       padding:14px 10px 6px;font-weight:700}
  main.content{flex:1;padding:22px 26px 60px;max-width:1240px;min-width:0}
  @media(max-width:820px){
    .shell{flex-direction:column}
    nav.rail{width:100%;flex:none;position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:none;border-bottom:1px solid var(--line)}
    nav.rail .navsec{display:none}
    main.content{padding:16px}
  }

  /* ---------- primitives ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .panel.tight{padding:14px}
  h1.page{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}
  p.lede{color:var(--muted);margin:0 0 18px;font-size:13px;max-width:74ch;line-height:1.55}
  h2{font-size:14px;margin:0 0 10px;letter-spacing:-.1px}
  h3{font-size:12.5px;margin:0 0 8px;color:var(--ink)}
  label{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-weight:600;
        text-transform:uppercase;letter-spacing:.4px}
  label.plain{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
  input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
        font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  textarea{resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
  button{font-family:inherit}
  button.primary{background:var(--accent);color:#fff;border:none;padding:9px 15px;border-radius:8px;cursor:pointer;
        font-size:13px;font-weight:600}
  button.primary:hover{background:#2560d8}
  button.primary[disabled]{background:#b9c8e4;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid var(--line);padding:6px 11px;border-radius:7px;cursor:pointer;
        font-size:12px;color:var(--muted);font-weight:500}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  button.ghost.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--red);border-color:#f2c9c6}
  button.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
  .muted{color:var(--muted);font-size:12.5px}
  .small{font-size:11.5px}
  .note{background:var(--amber-soft);border:1px solid #f0e3a8;border-radius:8px;padding:10px 12px;font-size:12px;
        color:#7a6a1f;margin-top:10px;line-height:1.55}
  .note code{background:#fdf3c0;padding:1px 5px;border-radius:4px}
  .note.info{background:var(--accent-soft);border-color:#c8dbff;color:#254a91}
  .note.ok{background:var(--green-soft);border-color:#bfe6d5;color:#0f6b46}
  .note.warn{background:var(--red-soft);border-color:#f5cdca;color:#98332e}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.3px;
        text-transform:uppercase;vertical-align:middle}
  .pill.blue{background:var(--accent-soft);color:var(--accent)}
  .pill.green{background:var(--green-soft);color:var(--green)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .pill.red{background:var(--red-soft);color:var(--red)}
  .pill.grey{background:#eef1f5;color:#6b7a8d}
  .stat{display:inline-block;margin-right:14px;font-size:12.5px;color:var(--muted)}
  .stat b{color:var(--ink);font-weight:650}
  .sidecard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px}
  .lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .toggle button{border:none;background:#fff;padding:6px 13px;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500}
  .toggle button.on{background:var(--accent);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  th{color:var(--muted);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  tr:last-child td{border-bottom:none}
  .scrollx{overflow-x:auto}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
  .empty{text-align:center;padding:34px 20px;color:var(--muted)}
  .empty .big{font-size:32px;margin-bottom:8px;opacity:.5}

  /* ---------- gallery ---------- */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;
        transition:.12s;min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
  .card:hover{border-color:var(--accent);box-shadow:0 3px 14px rgba(47,111,237,.11);transform:translateY(-1px)}
  .card .nm{font-weight:650;font-size:13.5px;margin-bottom:5px;word-break:break-word;line-height:1.3}
  .card .sub{font-size:11.5px;color:var(--muted)}
  .card .chips{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
  .card.new{align-items:center;justify-content:center;color:var(--accent);border-style:dashed;text-align:center;font-weight:600}
  .card.new .plus{font-size:30px;line-height:1;margin-bottom:4px}

  /* ---------- detail / sequence ---------- */
  .detailgrid{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .col-left{flex:0 0 230px;min-width:200px}
  .col-mid{flex:1 1 400px;min-width:320px;text-align:center}
  .col-right{flex:0 0 260px;min-width:230px}
  .comp{display:flex;align-items:center;gap:7px;padding:5px;border-radius:6px;cursor:pointer;font-size:11.5px}
  .comp:hover{background:var(--accent-soft)}
  .comp-sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}
  .comp-nm{flex:1;word-break:break-word}
  .comp-pos{color:var(--muted);flex:0 0 auto;font-size:10.5px}
  .comp-x{border:none;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0 2px}
  .seqwrap{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--panel2);max-height:340px;
        overflow:auto;text-align:left}
  .seqline{display:flex;gap:10px;line-height:1.65}
  .pos{color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;white-space:pre;user-select:none}
  .bases{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .b{cursor:pointer}
  .b.sel{background:var(--sel);box-shadow:inset 0 -2px 0 #e0a800}
  .b.prev{background:#fff0b3}
  .seqbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;line-height:1.55;
        background:var(--panel2);padding:11px;border-radius:8px;border:1px solid var(--line);max-height:230px;overflow:auto}
  svg text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}

  /* ---------- alignment ---------- */
  .alnblock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre;
        overflow-x:auto;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px}
  .aln-lbl{display:inline-block;width:78px;color:var(--muted);font-size:10.5px}
  .mm{background:#ffd8d5;color:#8f2f29;font-weight:700}
  .gp{background:#e6e9ee;color:#5a6675}

  /* ---------- overlays ---------- */
  .modalbg{position:fixed;inset:0;background:rgba(18,28,42,.4);z-index:1200;display:flex;align-items:center;
        justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:820px;width:100%;max-height:86vh;overflow:auto;
        box-shadow:0 18px 56px rgba(0,0,0,.28)}
  .sidebar{position:fixed;right:0;top:0;height:100%;width:320px;background:#fff;border-left:1px solid var(--line);
        box-shadow:-6px 0 26px rgba(0,0,0,.11);padding:20px;z-index:1100;overflow:auto}
  .swatch{display:inline-block;width:20px;height:20px;border-radius:6px;margin:0 5px 5px 0;cursor:pointer;
        border:2px solid transparent;vertical-align:middle}
  .swatch.on{border-color:var(--ink)}
  .menuitem{padding:7px 12px;font-size:12.5px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .menuitem:hover{background:var(--accent-soft)}
  .menuitem.danger{color:var(--red)}
  .menuitem.muted{color:var(--muted)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16202b;color:#fff;
        padding:10px 18px;border-radius:9px;font-size:13px;z-index:2000;box-shadow:0 6px 24px rgba(0,0,0,.28)}

  /* ---------- protocol runner ---------- */
  .step{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px}
  .step:hover{background:var(--panel2)}
  .step.done{opacity:.5}
  .step.done .steptext{text-decoration:line-through}
  .step input[type=checkbox]{width:16px;height:16px;flex:0 0 auto;margin-top:2px;accent-color:var(--accent)}
  .steptext{flex:1;line-height:1.55;font-size:12.5px}
  .stepmeta{font-size:11px;color:var(--muted);margin-top:2px}

  /* ---------- how-it-works explainer ---------- */
  .howbox{font-size:13px;line-height:1.6;color:var(--ink-2);max-width:72ch;display:flex;flex-direction:column;gap:10px}
  .howbox h3{font-size:12.5px;margin:6px 0 0;color:var(--ink)}
  .howbox p{margin:0}
  .howdiag{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:14px;
        font-size:11.5px;line-height:1.7;white-space:pre;overflow-x:auto;color:var(--ink)}
  .howfwd{color:var(--accent);font-weight:700}
  .howrev{color:var(--accent2);font-weight:700}
  .howmut{color:var(--red);font-weight:700}

  /* ---------- primer anatomy ---------- */
  .primerline{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;
        font-size:12.5px;word-break:break-all;line-height:1.7;margin-top:10px}
  .ptail{background:#ffe0b3;color:#7a4a00;border-radius:3px;padding:1px 2px;font-weight:600}
  .panneal{background:#d6f5d6;color:#17632f;border-radius:3px;padding:1px 2px;font-weight:600}
  .primerkey{display:flex;gap:16px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--muted)}
  .primerkey .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;
        vertical-align:-1px;padding:0}

  /* ---------- make-this routes ---------- */
  .routegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:4px}
  .routecard{border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;background:var(--panel2);
        transition:.12s}
  .routecard:hover{border-color:var(--accent)}
  .routecard:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .routecard.on{border-color:var(--accent);background:var(--accent-soft)}
  .routecard.blocked{opacity:.72}
  .card .cardmake{position:absolute;bottom:8px;right:8px;border:1px solid var(--line);background:var(--panel);
        border-radius:7px;cursor:pointer;font-size:12px;padding:2px 7px;opacity:0;transition:opacity .12s}
  .card:hover .cardmake{opacity:1}
  .card .cardmake:hover{border-color:var(--accent)}

  /* ---------- point mutation ---------- */
  .muttail{background:#ffe0b3;border-radius:3px;color:#7a4a00;font-weight:600}
  .mutdiff{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px;
        display:flex;flex-direction:column;gap:6px;overflow-x:auto}
  .mutdiff .mono{font-size:12.5px;white-space:nowrap}
  .mutlbl{display:inline-block;width:72px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
        color:var(--muted);font-weight:700}
  .mutold{background:#ffd8d5;color:#8f2f29;border-radius:3px;padding:0 2px}
  .mutnew{background:#d6f5d6;color:#17632f;border-radius:3px;padding:0 2px}

  /* ---------- structure ladder ---------- */
  .ladder{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .lrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
  .lrow .pill{flex:0 0 auto;min-width:64px;text-align:center}
  .candrow{display:flex;align-items:center;gap:12px;padding:10px 11px;border:1px solid var(--line);
        border-radius:9px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
  .candrow:hover{border-color:var(--accent);background:var(--accent-soft)}
  .candrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .candrow.on{border-color:var(--accent);background:var(--accent-soft)}
  .candsub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- protocol tree ---------- */
  .tree{display:flex;flex-direction:column}
  .tnode{border-top:1px solid var(--line2)}
  .tnode:first-child{border-top:none}
  .tbranch{display:flex;align-items:center;gap:10px;padding:11px 6px;cursor:pointer;user-select:none;border-radius:7px}
  .tbranch:hover{background:var(--panel2)}
  .tbranch:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tcaret{font-size:10px;color:var(--muted);transition:transform .12s;width:10px;flex:0 0 auto}
  .tbranch.open .tcaret{transform:rotate(90deg)}
  .tname{font-weight:650;font-size:13.5px;flex:0 0 auto}
  .tcount{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
        border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .tleaves{padding:0 0 8px 24px;display:flex;flex-direction:column;border-left:1px solid var(--line2);margin-left:10px}
  .tleaf{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;border-radius:7px;font-size:12.5px}
  .tleaf:hover{background:var(--accent-soft)}
  .tleaf:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tleafnm{font-weight:550;flex:0 0 auto}
  .tmeta{color:var(--muted);font-size:11.5px;flex:1}
  .tprog{display:inline-flex;align-items:center;gap:7px}
  .tprog .bar{display:inline-block;height:5px}

  /* ---------- pre-check rows: click or drag to select ---------- */
  .obrow{display:flex;gap:9px;align-items:center;margin:2px 0;padding:5px 8px;border-radius:7px;
        text-transform:none;font-weight:400;letter-spacing:0;font-size:12.5px;color:var(--ink);
        cursor:pointer;user-select:none;border:1px solid transparent}
  .obrow:hover{background:var(--panel2);border-color:var(--line)}
  .obrow.on{background:var(--accent-soft)}
  .obrow input{accent-color:var(--accent)}

  /* ---------- foldaway detail sections ---------- */
  details.fold{border-top:1px solid var(--line2);margin-top:8px}
  details.fold > summary{cursor:pointer;list-style:none;padding:8px 0 4px;font-size:11.5px;font-weight:600;
        color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
  details.fold > summary::-webkit-details-marker{display:none}
  details.fold > summary::before{content:"▸";font-size:10px;transition:transform .12s;color:var(--muted)}
  details.fold[open] > summary::before{transform:rotate(90deg)}
  details.fold > summary:hover{color:var(--accent)}

  /* ---------- construct cards: reorder + colour ---------- */
  .card{position:relative}
  .card .cardstripe{position:absolute;left:0;right:0;top:0;height:3px;border-radius:11px 11px 0 0}
  .card .carddot{position:absolute;top:9px;right:9px;width:13px;height:13px;border-radius:50%;
        border:1.5px solid transparent;cursor:pointer;padding:0;opacity:0;transition:opacity .12s}
  .card:hover .carddot{opacity:1}
  .card .carddot:hover{transform:scale(1.2)}
  .card .cardnote{position:absolute;bottom:9px;right:10px;font-size:9.5px;letter-spacing:.06em;
        text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
  .card.dragging{opacity:.4}
  .card.dropzone{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .cswatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .cswatch.on{border-color:var(--ink)}
  .cswatch.none{background:var(--panel2);border-color:var(--line);color:var(--muted);font-size:12px}

  /* ---------- a back button you can find ---------- */
  .backbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-weight:600;
        padding:7px 14px 7px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;
        display:inline-flex;align-items:center;gap:7px}
  .backbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .backbtn span{font-size:15px;line-height:1}

  /* ---------- onboarding ---------- */
  .onboard{max-width:960px;margin:0 auto;padding:18px 0 40px}
  .onboard-head{margin-bottom:26px}
  .eyebrow-ob{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
        font-weight:700;margin-bottom:8px}
  .obgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
  .obcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;
        transition:.12s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
  .obcard:hover,.obcard:focus-visible{border-color:var(--accent);transform:translateY(-1px);
        box-shadow:0 4px 16px rgba(47,111,237,.13);outline:none}
  .obcard.on{border-color:var(--accent);background:var(--accent-soft)}
  .obcard .obic{font-size:24px;line-height:1}
  .obcard h3{font-size:15px;margin:0}
  .obcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
  .obcard .obex{font-size:11.5px;color:var(--muted);font-style:italic}
  .obcard .obtools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

  /* ---------- start screen ---------- */
  .actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .actcard{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
        border-radius:10px;padding:14px;cursor:pointer;transition:.12s}
  .actcard:hover,.actcard:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
  .actcard .actic{font-size:17px;line-height:1.2;flex:0 0 auto}
  .actcard h3{margin:0 0 3px;font-size:13.5px}
  .actcard p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
  .statrow{display:flex;gap:18px;flex-wrap:wrap}
  .statrow div{display:flex;flex-direction:column}
  .statrow b{font-size:22px;font-weight:700;line-height:1.2}
  .statrow span{font-size:11.5px;color:var(--muted)}
  .toolgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
  .toolchip{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--line);
        border-radius:9px;cursor:pointer;font-size:12.5px;background:var(--panel2);opacity:.55}
  .toolchip.on{opacity:1;background:var(--panel)}
  .toolchip:hover{border-color:var(--accent)}
  .toolchip span span{display:block}
  .toolchip .ic{font-size:15px;flex:0 0 auto}

  /* ---------- rail footer ---------- */
  .railfoot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line2);
        display:flex;flex-direction:column;gap:6px}
  .depthrow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 4px}
  .depthlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .toggle.mini button{padding:3px 8px;font-size:11px}
  nav.rail .navitem.tiny{font-size:11.5px;color:var(--muted);padding:5px 10px}
  nav.rail .navitem.tiny:hover{color:var(--accent)}
  @media(max-width:820px){ .railfoot{flex-direction:row;align-items:center;border-top:none;margin-top:0;padding-top:0} }

  /* ---------- enzyme shelf grid ---------- */
  .enzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:6px}
  .enzcell{display:flex;align-items:center;gap:7px;margin:0;padding:7px 9px;border:1px solid var(--line);
        border-radius:8px;background:var(--panel2);cursor:pointer;font-size:12px;font-weight:400;
        letter-spacing:0;color:var(--ink);text-transform:none}
  .enzcell:hover{border-color:var(--accent)}
  .enzcell.has{background:var(--green-soft);border-color:#bfe6d5}
  .enzcell .enznm{font-weight:650;flex:0 0 auto}
  .enzcell .enzsite{color:var(--muted);font-size:10.5px}
  .lineage{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
  .lineage .node{border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--panel2)}
  .lineage .arrow{color:var(--muted)}

  /* ---------- connect ---------- */
  .bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .matchrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
  .matchrow:last-child{border-bottom:none}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🧬 BetterBench</div>
  <span class="tag">local workspace &middot; nothing leaves this browser</span>
  <div class="spacer"></div>
  <button class="ghost" onclick="exportWorkspace()">Export</button>
  <button class="ghost" onclick="document.getElementById('importFile').click()">Import</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importWorkspace(this)">
</header>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main class="content" id="main"></main>
</div>
<div id="overlays"></div>
